<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Reputation Manager</title>
<link rel="icon" type="image/png" sizes="32x32" href="img/icone-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="img/icone-512.png">
<link rel="apple-touch-icon" href="img/icone-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* Mise en page : bandeau de marque, barre d'onglets, colonne de travail unique ; couleurs fournies par les paramètres de la plateforme */
:root{
  --accent:#C6DD1F;            /* couleur principale de l'agence (paramètres) */
  --bg:#111111;                /* fond de l'agence (paramètres) */
  --panel:color-mix(in srgb,var(--bg) 88%,#ffffff 12%);
  --panel2:color-mix(in srgb,var(--bg) 80%,#ffffff 20%);
  --line:color-mix(in srgb,var(--bg) 72%,#ffffff 28%);
  --fg:#F2F3EE;
  --muted:#A9AD9F;
  --on-accent:#111111;
  --neg:#FF6B5B; --neu:#9AA0A6; --pos:#5FD38D; --warn:#F5B941;
  --display:"Space Grotesk","Segoe UI",system-ui,sans-serif;
  --text:"Inter","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--text)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:78rem;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Boutons et champs */
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.btn.sec{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.sec:hover{border-color:var(--accent)}
.btn.danger{background:transparent;color:var(--neg);border:1px solid color-mix(in srgb,var(--neg) 50%,transparent)}
.btn.mini{padding:4px 9px;font-size:.8rem}
input[type=text],input[type=search],input[type=datetime-local],input[type=email],input[type=password],input[type=number],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-height:38px}
textarea{min-height:70px;resize:vertical}
label{display:grid;gap:4px;font-size:.85rem;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.row>*{flex:1 1 180px;min-width:0}
.row>.btn{flex:0 0 auto}

/* Connexion : carte centrée sur fond de marque, motif du logo en filigrane */
.ecran-marque{position:relative;min-height:100vh;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden;isolation:isolate}
.filigrane{position:absolute;inset:0;z-index:-1;pointer-events:none}
.filigrane i{position:absolute;display:block;background-image:var(--motif);background-repeat:no-repeat;background-size:contain;background-position:center}
.filigrane .grappe{background-repeat:repeat;background-size:42px auto;opacity:.13;
  -webkit-mask-image:radial-gradient(closest-side,#000 35%,transparent 100%);mask-image:radial-gradient(closest-side,#000 35%,transparent 100%)}
.filigrane .g1{top:-40px;right:-30px;width:380px;height:300px}
.filigrane .g2{bottom:-50px;left:-40px;width:340px;height:280px}
.filigrane .geant{opacity:.045}
.filigrane .s1{width:420px;height:420px;left:-150px;top:8%;transform:rotate(-14deg)}
.filigrane .s2{width:300px;height:300px;right:-90px;bottom:6%;transform:rotate(12deg)}
.filigrane .s3{width:110px;height:110px;right:14%;top:12%;transform:rotate(18deg);opacity:.08}
.filigrane .s4{width:84px;height:84px;left:16%;bottom:12%;transform:rotate(-20deg);opacity:.08}
.filigrane .halo{inset:auto;left:50%;top:50%;width:760px;height:760px;max-width:160vw;transform:translate(-50%,-50%);background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 16%,transparent),transparent 72%)}
.carte-connexion{width:min(420px,100%);display:grid;gap:18px;justify-items:stretch;text-align:center;
  background:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border:1px solid color-mix(in srgb,var(--accent) 28%,var(--line));border-radius:18px;padding:40px 36px 32px;
  box-shadow:0 30px 80px rgba(0,0,0,.55)}
.carte-connexion .logo{max-height:96px;max-width:min(260px,100%);justify-self:center;object-fit:contain}
.carte-connexion h1{font-size:1.2rem;letter-spacing:.02em;font-weight:500}
.carte-connexion .trait{width:44px;height:2px;background:var(--accent);justify-self:center;border-radius:2px;margin-top:-6px}
.carte-connexion label{text-align:left}
.carte-connexion input{padding:11px 12px;background:color-mix(in srgb,var(--bg) 85%,#000)}
.carte-connexion .btn{padding:12px 14px;font-size:1rem;border-radius:8px;letter-spacing:.01em}
.carte-connexion .aide{font-size:.8rem;color:var(--muted);margin:0}
.erreur{color:var(--neg);font-size:.88rem;min-height:1.2em;margin:-6px 0}
@media (max-width:520px){.carte-connexion{padding:32px 22px 26px}.filigrane .g1,.filigrane .g2{width:220px;height:180px}.filigrane .s1{width:260px;height:260px}}
/* En-tête */
header.haut{border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header.haut .wrap{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding-block:10px}
.marque{display:flex;align-items:center;gap:12px;min-width:0}
.marque img{height:38px;max-width:160px;object-fit:contain}
.marque h1{font-size:1.15rem;line-height:1.1}
.marque .agence{font-size:.75rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.compte{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.85rem}
.compte select{width:auto;padding:5px 8px}
nav.onglets{border-bottom:1px solid var(--line)}
nav.onglets .wrap{display:flex;gap:4px;overflow-x:auto}
nav.onglets button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:10px 12px;cursor:pointer;white-space:nowrap;font-weight:500}
nav.onglets button[aria-selected=true]{color:var(--fg);border-bottom-color:var(--accent)}
nav.onglets .compteur{display:inline-block;min-width:1.4em;margin-left:5px;padding:0 5px;border-radius:9px;background:var(--panel2);font-size:.75rem;color:var(--fg)}
main{padding-block:20px 48px}
section.vue{display:grid;gap:16px}
.entete-vue{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
.entete-vue h2{font-size:1.3rem}

/* Tableau de bord */
.chiffres{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.chiffre{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
.chiffre b{display:block;font:700 1.8rem/1.1 var(--display)}
.chiffre span{font-size:.82rem;color:var(--muted)}
.chiffre.alerte{border-color:color-mix(in srgb,var(--neg) 60%,var(--line))}
.par-marque{width:100%;border-collapse:collapse;font-size:.9rem}
.par-marque th,.par-marque td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
.par-marque th{color:var(--muted);font-weight:500;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
.par-marque td.n{text-align:right}
.defile{overflow-x:auto}

/* Publications */
.filtres{display:flex;flex-wrap:wrap;gap:8px}
.filtres select,.filtres input{width:auto;min-width:0}
.liste{display:grid;gap:10px}
.barre-filtres{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.barre-filtres select{width:auto;min-width:0;flex:1 1 170px;max-width:260px}
.barre-filtres input[type=search]{flex:1 1 200px;max-width:280px;width:auto}
.segments{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.segments button{background:var(--panel);color:var(--fg);border:0;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer;min-height:38px}
.segments button+button{border-left:1px solid var(--line)}
.segments button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.grille-pubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;align-items:start}
.grille-pubs>.vide,.grille-pubs>p{grid-column:1/-1}
.pub{font-size:.88rem;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.pub.epingle{box-shadow:0 0 0 1px var(--accent)}
.pub-image{display:block;height:128px;background:var(--panel2);border-bottom:1px solid var(--line)}
.pub-image img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.pub-corps{padding:12px 13px 13px;display:grid;gap:8px}
.pub-auteur{font-weight:700;font-size:.98rem}
.pub-texte{overflow-wrap:anywhere;line-height:1.5}
.pub-meta{font-size:.8rem;color:var(--muted)}
.pub-stats{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.82rem;color:var(--muted)}
.pub-stats b{color:var(--fg)}
.pub-actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pub-actions a{font-weight:600;margin-right:4px}
.pub-motifs{display:flex;flex-wrap:wrap;gap:4px;font-size:.75rem}
.pub-motifs span{background:var(--panel2);border-radius:10px;padding:1px 8px}
.pub-motifs .statut{background:var(--accent);color:var(--on-accent);font-weight:600}
.puce{display:inline-block;padding:1px 8px;border-radius:10px;font-size:.75rem;font-weight:600;background:var(--panel2)}
.puce.Négatif{color:var(--neg)} .puce.Positif{color:var(--pos)} .puce.Neutre{color:var(--neu)}
.puce.acc{background:var(--accent);color:var(--on-accent)}
.vide{border:1px dashed var(--line);border-radius:8px;padding:28px 20px;text-align:center;color:var(--muted)}

/* Administration */
.admin-grille{display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:start}
.admin-menu{display:grid;gap:2px;position:sticky;top:120px}
.admin-menu button{background:none;border:0;text-align:left;padding:8px 10px;border-radius:6px;color:var(--muted);cursor:pointer}
.admin-menu button[aria-current=true]{background:var(--panel);color:var(--fg)}
.bloc{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:12px;min-width:0}
.bloc h3{font-size:1.02rem}
table.tab{width:100%;border-collapse:collapse;font-size:.88rem}
table.tab th,table.tab td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.tab th{color:var(--muted);font-weight:500;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.mdp{font:600 1.05rem/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--accent);border-radius:6px;padding:8px 10px;user-select:all}
.confirmation{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:color-mix(in srgb,var(--neg) 12%,var(--panel));border-radius:6px;padding:8px 10px;font-size:.85rem}
.clients-coches{display:flex;flex-wrap:wrap;gap:6px 14px}
.clients-coches label{display:flex;flex-direction:row;gap:6px;align-items:center;color:var(--fg)}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 14px;max-width:min(420px,calc(100vw - 32px));z-index:20}
.toast.ko{border-color:var(--neg)}
@media (max-width:720px){.admin-grille{grid-template-columns:1fr}.admin-menu{position:static;display:flex;flex-wrap:wrap}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Camembert de tonalité */
.camembert-vue{display:flex;flex-wrap:wrap;gap:20px 36px;align-items:center}
.camembert-app{width:180px;aspect-ratio:1;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 4px var(--panel2)}
.legende-app{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.legende-app li{display:grid;grid-template-columns:14px 80px 70px auto;gap:10px;align-items:center}
.legende-app i{width:14px;height:14px;border-radius:3px}
.legende-app b{font:700 1.2rem var(--display);text-align:right}
/* Contrôle qualité */
ul.pb{margin:6px 0 0;padding-left:16px;color:var(--fg)}
.alerte-ctl{border-color:color-mix(in srgb,var(--neg) 60%,var(--line))}
/* Récapitulatif */
.marque-cell{display:flex;align-items:center;gap:8px}
.marque-cell img{width:28px;height:28px;object-fit:contain;background:#fff;border-radius:5px;padding:2px}
table.tab td.n,table.tab th.n{text-align:right}
.hausse{color:var(--warn)} .baisse{color:var(--pos)}

/* Fiche marque : lignes de saisie */
.fiche{display:grid;gap:16px}
.identite{display:grid;grid-template-columns:170px 1fr;gap:18px;align-items:start}
.logo-zone{display:grid;gap:8px;justify-items:start}
.logo-apercu{width:150px;height:110px;border:1px dashed var(--line);border-radius:10px;display:grid;place-items:center;background:#fff;overflow:hidden}
.logo-apercu img{max-width:88%;max-height:88%;object-fit:contain}
.logo-apercu span{color:#888;font-size:.85rem}
label.fichier{display:inline-block;cursor:pointer;color:var(--fg)}
.lignes{display:grid;gap:8px}
.ligne{display:grid;gap:8px;align-items:center}
.ligne-mot,.ligne-excl,.ligne-terme{grid-template-columns:1fr auto}
.ligne-compte{grid-template-columns:130px 1fr auto}
.ligne-hater{grid-template-columns:130px 1fr 1.4fr auto}
.ajouter{justify-self:start}
.sous-titre{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:4px}
.concurrent{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:12px;display:grid;gap:10px}
#z-conc{display:grid;gap:12px}
#ajout-conc{justify-self:start}
.puces{display:flex;flex-wrap:wrap;gap:6px}
.proposition{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--fg);border:1px dashed color-mix(in srgb,var(--accent) 60%,transparent);border-radius:14px;padding:3px 10px;font-size:.82rem;cursor:pointer}
.proposition:hover{background:var(--accent);color:var(--on-accent)}
.propositions{display:grid;gap:6px}
.aide-requete{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 12px}
.aide-requete summary{cursor:pointer;color:var(--accent);font-size:.88rem}
.aide-requete ul{margin:6px 0 2px;padding-left:18px}
code{background:var(--panel2);padding:1px 5px;border-radius:4px;font-size:.85em}
.barre-enregistrer{position:sticky;bottom:0;z-index:4;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));border-radius:10px;padding:10px 14px;margin-bottom:calc(env(safe-area-inset-bottom,0px))}
.barre-enregistrer .btn{padding:10px 18px}
/* Critères */
.groupe-crit{border:1px solid var(--line);border-radius:8px;padding:10px 12px 12px;margin:0;display:grid;gap:12px}
.groupe-crit legend{padding:0 6px;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.crit{display:grid;grid-template-columns:1fr 200px;gap:4px 14px;align-items:center}
.crit label{color:var(--fg);font-size:.9rem}
.crit-val{display:flex;gap:8px;align-items:center}
.crit-val input{max-width:130px}
.crit>span{grid-column:2}
@media (max-width:720px){
  .identite{grid-template-columns:1fr}
  .ligne-compte{grid-template-columns:1fr auto}.ligne-compte select{grid-column:1/-1}
  .ligne-hater{grid-template-columns:1fr auto}.ligne-hater select,.ligne-hater input{grid-column:1}.ligne-hater .retirer{grid-column:2;grid-row:1/4}
  .crit{grid-template-columns:1fr}.crit>span{grid-column:1}
}

/* ===== Rapport (format A4, imprimable) ===== */
body.rapport-ouvert{overflow:hidden}
.rapport{position:fixed;inset:0;z-index:30;overflow:auto;background:#2a2a2a;padding-bottom:40px}
.r-outils{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px max(16px,env(safe-area-inset-left,0px));padding-top:calc(10px + env(safe-area-inset-top,0px));background:#111;border-bottom:1px solid #333}
.r-doc{--r-acc:var(--accent);--r-ink:#16180f;--r-neg:#E5484D;--r-neu:#A3A69C;--r-pos:#3DA56A;display:grid;gap:18px;justify-items:center;padding:18px 16px;color:var(--r-ink);font:13px/1.5 var(--text)}
.page{position:relative;width:min(210mm,100%);min-height:min(297mm,141vw);background:#fff;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 8px 30px rgba(0,0,0,.4);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page.flux{min-height:auto}
.page h3{font:700 1rem/1.3 var(--display);margin:18px 0 8px;color:var(--r-ink)}
.page h3::before{content:"";display:inline-block;width:10px;height:10px;background:var(--r-acc);border-radius:2px;margin-right:8px}
.page ul{margin:0;padding-left:20px;display:grid;gap:5px}
.motif{position:absolute;inset:0;background-image:var(--motif);background-repeat:repeat;background-size:64px auto;opacity:.07;pointer-events:none}
.couverture,.separation,.dos{background:#111;color:#fff}
.couverture{padding:13mm 13mm 0}
.c-logo{position:relative;width:46mm;max-width:40%}
.c-titre{position:relative;margin-top:auto;padding:0 0 8mm}
.c-titre h1{font:700 clamp(1.6rem,5vw,2.4rem)/1.12 var(--display);max-width:13em;color:#fff}
.c-titre h1::after{content:"";display:block;width:60px;height:4px;background:var(--r-acc);margin-top:12px;border-radius:2px}
.c-bande{position:relative;margin:0 -13mm;background:var(--r-acc);color:#111;padding:8mm 13mm;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
.c-bande dl{margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 28px;flex:1 1 300px}
.c-bande dt{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;opacity:.7}
.c-bande dd{margin:0;font-weight:600}
.c-conf{font:700 .8rem var(--display);letter-spacing:.18em;border:2px solid #111;padding:5px 10px}
.c-client{position:relative;align-self:flex-end;margin:10mm 0;background:#fff;border-radius:10px;padding:8px 14px;max-width:55mm;min-height:22mm;display:grid;place-items:center;color:#111}
.c-client img,.sep-client img{max-width:100%;max-height:30mm;object-fit:contain}
.separation,.dos{align-items:center;justify-content:center;gap:16px;text-align:center}
.sep-client{position:relative;background:#fff;border-radius:14px;padding:16px 22px;max-width:70mm;color:#111;font-size:1.5rem}
.separation p,.dos p{position:relative;font:600 1.1rem var(--display);color:#fff;margin:0}
.dos img{position:relative;width:70mm;max-width:70%}
.r-entete{display:flex;align-items:center;gap:14px;background:#111;color:#fff;padding:5mm 10mm;border-bottom:3px solid var(--r-acc)}
.r-entete img{height:11mm}
.r-entete h2{flex:1;font:700 1.15rem var(--display);color:#fff}
.r-logo-client{background:#fff;border-radius:6px;padding:3px 8px;height:12mm;display:grid;place-items:center;color:#111;font-size:.8rem;max-width:40mm}
.r-logo-client img{max-height:10mm;max-width:100%;object-fit:contain}
.r-corps{padding:6mm 10mm 8mm;flex:1}
.r-periode{margin:0 0 6px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}
.kpis>div{border:1px solid #e3e5dc;border-top:3px solid var(--r-acc);border-radius:6px;padding:8px 10px;display:grid}
.kpis b{font:700 1.4rem/1.1 var(--display)}
.kpis span{font-size:.75rem;color:#5d6155}
.deux{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
.barres{display:grid;gap:6px}
.barre{display:grid;grid-template-columns:minmax(80px,32%) 1fr 48px;gap:8px;align-items:center;font-size:.85rem}
.barre .lib{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barre .piste{height:12px;background:#eef0e8;border-radius:6px;overflow:hidden}
.barre .piste i{display:block;height:100%;background:linear-gradient(90deg,#111 0,#3a3d33 100%);border-right:3px solid var(--r-acc)}
.barre b{text-align:right}
.camembert{width:44mm;max-width:100%;aspect-ratio:1;border-radius:50%;margin:6px auto}
.legende{list-style:none;padding:0!important;font-size:.82rem}
.legende i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.note{font-size:.75rem;color:#6b6f63;border-top:1px solid #e3e5dc;padding-top:6px;margin-top:14px}
.vide-r{color:#6b6f63;font-style:italic}
.r-tab{width:100%;border-collapse:collapse;font-size:.82rem}
.r-tab th,.r-tab td{text-align:left;padding:5px 6px;border-bottom:1px solid #e3e5dc;vertical-align:top}
.r-tab th{background:#f3f4ee;font-weight:600}
.r-tab .n{text-align:right}
.r-pubs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.r-pub{border:1px solid #e3e5dc;border-radius:8px;overflow:hidden;break-inside:avoid;display:flex;flex-direction:column;font-size:.8rem}
.r-pub-tete{background:#111;color:var(--r-acc);font:700 .72rem var(--display);letter-spacing:.12em;padding:5px 9px}
.r-pub.Négatif .r-pub-tete{box-shadow:inset 4px 0 0 var(--r-neg)}
.r-pub.Positif .r-pub-tete{box-shadow:inset 4px 0 0 var(--r-pos)}
.r-capture{width:100%;max-height:52mm;object-fit:cover;background:#f3f4ee}
.r-pub-corps{padding:7px 9px;display:grid;gap:4px}
.r-dates{color:#6b6f63;font-size:.72rem}
.r-titre{font-weight:600}
.r-texte{overflow-wrap:anywhere}
.r-stats{font-weight:600}
.r-tags{color:#4c5044}
.r-pub a{color:#4a5a00;overflow-wrap:anywhere;font-size:.72rem}
.r-pied{display:flex;justify-content:space-between;gap:10px;padding:3mm 10mm;font-size:.7rem;color:#6b6f63;border-top:1px solid #e3e5dc}
.c-haut{position:relative;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.c-mention{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:#cfd3c4;text-align:right;max-width:55%}
.c-sur{display:block;font:600 .78rem var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--r-acc);margin-bottom:8px}
.sommaire{position:relative;list-style:none;padding:0;margin:10mm 0 0;display:grid;gap:8px;min-width:60%;counter-reset:s}
.sommaire li{display:flex;align-items:center;gap:10px;border-bottom:1px solid #333;padding:6px 0;font:500 1rem var(--display)}
.sommaire li::before{content:"";width:8px;height:8px;background:var(--r-acc);border-radius:2px}
.r-ent-titre{flex:1;display:grid;gap:2px}
.r-ent-titre span{font-size:.72rem;color:#cfd3c4}
.kpis.cinq{grid-template-columns:repeat(5,minmax(0,1fr))}
.kpis b.sm{font-size:.95rem;line-height:1.2}
.colonnes{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;height:44mm;align-items:end;border-bottom:1px solid #e3e5dc;padding-bottom:4px}
.colonnes .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;font-size:.75rem}
.colonnes .barre-v{width:70%;background:#111;border-top:3px solid var(--r-acc);border-radius:3px 3px 0 0;min-height:2px}
.colonnes .lib{color:#6b6f63}
.nuage{text-align:center;line-height:1.35;padding:8px 4px;border:1px solid #e3e5dc;border-radius:8px;min-height:50mm;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:2px 10px}
.nuage span{color:#3a3d33}
.nuage span.fort{color:#111;background:linear-gradient(transparent 62%,color-mix(in srgb,var(--r-acc) 70%,transparent) 62%)}
.r-atts{display:grid;gap:10px}
.r-att{border:1px solid #e3e5dc;border-radius:8px;overflow:hidden;break-inside:avoid}
.r-att-corps{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:9px}
.r-att-capture{width:62mm;max-height:80mm;object-fit:contain;background:#f3f4ee;border-radius:4px}
.r-att-infos{display:grid;gap:5px;font-size:.82rem;align-content:start}
.r-motifs{display:flex;flex-wrap:wrap;gap:4px}
.r-motifs span{background:#f3f4ee;border:1px solid #e3e5dc;border-radius:10px;padding:1px 8px;font-size:.72rem}
.r-motifs .statut{background:#111;color:var(--r-acc);border-color:#111}
.r-texte-plein{overflow-wrap:anywhere}
.r-chiffres{display:flex;flex-wrap:wrap;gap:4px 14px}
.page.six .r-pubs{grid-template-rows:repeat(3,minmax(0,1fr));flex:1}
.page.six .r-corps{display:flex;flex-direction:column}
.r-texte.court{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.r-texte.long{display:-webkit-box;-webkit-line-clamp:10;-webkit-box-orient:vertical;overflow:hidden}
.page.six .r-capture{height:30mm;max-height:30mm;flex:0 0 auto}
.page.six .r-pub{min-height:0}
.page.six .r-pub-corps{min-height:0;overflow:hidden;gap:2px;font-size:.76rem}
.page.six .r-corps{min-height:0;overflow:hidden}
.nuage{min-height:95mm!important;font-size:1.15rem}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis.cinq{grid-template-columns:repeat(2,minmax(0,1fr))}.r-att-corps{grid-template-columns:1fr}.r-att-capture{width:100%}.page.six .r-pubs{grid-template-rows:none}.deux,.r-pubs{grid-template-columns:1fr}.c-bande dl{grid-template-columns:1fr}}
/* Export PDF : pages A4 rendues hors écran, mise en page bureau quelle que soit la taille de l'écran */
.r-doc.export{position:fixed;left:-10000px;top:0;width:210mm;display:block!important;padding:0!important;gap:0;pointer-events:none}
.r-doc.export .page{width:210mm!important;height:297mm!important;min-height:297mm!important;box-shadow:none;margin:0}
.r-doc.export .kpis{grid-template-columns:repeat(4,1fr)!important}.r-doc.export .kpis.cinq{grid-template-columns:repeat(5,1fr)!important}
.r-doc.export .deux{grid-template-columns:1.4fr 1fr!important}.r-doc.export .r-pubs{grid-template-columns:1fr 1fr!important}
.r-doc.export .page.six .r-pubs{grid-template-rows:repeat(3,minmax(0,1fr))!important}.r-doc.export .c-bande dl{grid-template-columns:1fr 1fr!important}
.r-doc.export .r-att-corps{grid-template-columns:auto 1fr!important}.r-doc.export .r-att-capture{width:62mm!important}
.r-doc.export .nuage span.fort{background:linear-gradient(transparent 62%,rgba(198,221,31,.7) 62%)}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff!important}
  body.rapport-ouvert>*:not(#rapport){display:none!important}
  body.rapport-ouvert::before{display:none}
  .rapport{position:static;overflow:visible;background:#fff;padding:0}
  .r-outils{display:none}
  .r-doc{padding:0;gap:0;display:block}
  .page{width:210mm;min-height:297mm;height:297mm;box-shadow:none;break-after:page}
  .page.flux{height:auto;min-height:297mm}
  .r-pubs{grid-template-columns:1fr 1fr}
  .kpis{grid-template-columns:repeat(4,1fr)}.kpis.cinq{grid-template-columns:repeat(5,1fr)}.r-att-corps{grid-template-columns:auto 1fr}.r-att-capture{width:62mm}.page.six .r-pubs{grid-template-rows:repeat(3,minmax(0,1fr))}.deux{grid-template-columns:1.4fr 1fr}.c-bande dl{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<!-- ===== Connexion ===== -->
<div id="ecran-connexion" class="ecran-marque" hidden>
  <div class="filigrane" aria-hidden="true"><i class="halo"></i><i class="grappe g1"></i><i class="grappe g2"></i><i class="geant s1"></i><i class="geant s2"></i><i class="s3"></i><i class="s4"></i></div>
  <form class="carte-connexion" id="f-connexion" novalidate>
    <img class="logo" id="c-logo" alt="" hidden>
    <h1 id="c-titre">Reputation Manager</h1>
    <div class="trait"></div>
    <label>Adresse e-mail<input type="email" id="c-email" autocomplete="username" required></label>
    <label>Mot de passe<input type="password" id="c-mdp" autocomplete="current-password" required></label>
    <div class="erreur" id="c-erreur" role="alert"></div>
    <button class="btn" type="submit" id="c-btn">Se connecter</button>
    <p class="aide">Mot de passe oublié : votre administrateur peut le réinitialiser.</p>
  </form>
</div>

<!-- ===== Changement de mot de passe obligatoire ===== -->
<div id="ecran-mdp" hidden>
  <div class="ecran-marque">
    <div class="filigrane" aria-hidden="true"><i class="halo"></i><i class="grappe g1"></i><i class="grappe g2"></i><i class="geant s1"></i><i class="geant s2"></i><i class="s3"></i><i class="s4"></i></div>
    <form class="carte-connexion" id="f-mdp" novalidate>
      <h1>Choisissez votre mot de passe</h1><div class="trait"></div>
      <p class="muted small">Le mot de passe reçu était provisoire. Choisissez-en un d'au moins 10 caractères.</p>
      <label>Nouveau mot de passe<input type="password" id="m-1" autocomplete="new-password"></label>
      <label>Confirmer<input type="password" id="m-2" autocomplete="new-password"></label>
      <div class="erreur" id="m-erreur" role="alert"></div>
      <button class="btn" type="submit">Enregistrer et continuer</button>
    </form>
  </div>
</div>

<!-- ===== Application ===== -->
<div id="ecran-app" hidden>
  <header class="haut">
    <div class="wrap">
      <div class="marque">
        <img id="h-logo" alt="" hidden>
        <div><h1 id="h-titre">Reputation Manager</h1><div class="agence" id="h-agence"></div></div>
      </div>
      <div class="compte">
        <label class="small" style="display:flex;flex-direction:row;align-items:center;gap:6px">Marque
          <select id="sel-client"></select></label>
        <span id="h-moi" class="muted"></span>
        <button class="btn sec mini" id="b-compte" type="button">Mon compte</button>
        <button class="btn sec mini" id="b-sortir" type="button">Se déconnecter</button>
      </div>
    </div>
  </header>
  <nav class="onglets" aria-label="Sections"><div class="wrap" id="onglets" role="tablist"></div></nav>
  <main class="wrap" id="contenu"></main>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
// ===== Configuration de la plateforme =====
const SB_URL='https://quheqdljsycelutylyts.supabase.co';
const SB_CLE='sb_publishable_q0M1LL74FcfKCbvzPoBy3Q_FUmXvKfV';
const SB=supabase.createClient(SB_URL,SB_CLE,{auth:{persistSession:true,autoRefreshToken:true,storage:window.localStorage}});

const ROLES={super_admin:'Super administrateur',admin_plateforme:'Administrateur plateforme',admin_agence:'Administrateur agence',user_agence:'Utilisateur agence',user_client:'Accès marque'};
const GERE={super_admin:Object.keys(ROLES),admin_plateforme:['admin_agence','user_agence','user_client'],admin_agence:['admin_agence','user_agence','user_client']};
const S={moi:null,clients:[],marques:[],client:'tous',periode:24,onglet:'tableau',admin:'recap',adminMarque:null,modifie:false,filtres:{}};
// Image de marque : fixée dans le code source, jamais modifiable depuis la plateforme
const IMAGE={nom_plateforme:'Totem Reputation Manager',nom_agence:'Totem Experience',couleur_principale:'#C6DD1F',couleur_fond:'#111111',logo_url:'img/logo-totem.png',motif_url:'img/motif-tx.png'};

const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nb=v=>v==null?'—':Number(v).toLocaleString('fr-FR');
const date=v=>v?new Date(v).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',timeZone:'UTC'}).replace(' ',' à ')+' UTC':'non disponible';
const estAdmin=()=>['super_admin','admin_plateforme','admin_agence'].includes(S.moi?.role);
const estOperateur=()=>['super_admin','admin_plateforme'].includes(S.moi?.role);
const peutAgir=()=>S.moi&&S.moi.role!=='user_client';
let tt;function toast(m,ko){const t=$('#toast');t.textContent=m;t.className='toast'+(ko?' ko':'');t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,ko?7000:3500)}
function lienSur(u){const s=String(u||'').trim();if(!s)return '';const h=/^https?:\/\//i.test(s)?s:'https://'+s;return /^https?:\/\//i.test(h)?h:''}

// ===== Image de marque =====
function appliquerMarque(p){
  if(!p)return;
  const r=document.documentElement.style;
  if(/^#[0-9a-f]{6}$/i.test(p.couleur_principale||''))r.setProperty('--accent',p.couleur_principale);
  if(/^#[0-9a-f]{6}$/i.test(p.couleur_fond||''))r.setProperty('--bg',p.couleur_fond);
  // texte sur la couleur principale : noir ou blanc selon sa clarté
  const h=(p.couleur_principale||'#C6DD1F').slice(1),l=(parseInt(h.slice(0,2),16)*299+parseInt(h.slice(2,4),16)*587+parseInt(h.slice(4,6),16)*114)/1000;
  r.setProperty('--on-accent',l>140?'#111111':'#FFFFFF');
  document.title=p.nom_plateforme||'Reputation Manager';
  for(const id of ['c-titre','h-titre'])$('#'+id).textContent=p.nom_plateforme||'Reputation Manager';
  $('#h-agence').textContent=p.nom_agence||'';
  const motif=p.motif_url||p.logo_url;if(motif)r.setProperty('--motif','url("'+motif.replace(/"/g,'')+'")');
  for(const id of ['c-logo','h-logo']){const im=$('#'+id);if(p.logo_url){im.src=p.logo_url;im.alt=p.nom_agence||'';im.hidden=false}else im.hidden=true}
}

// ===== Démarrage =====
async function demarrer(){
  appliquerMarque(IMAGE);
  const {data:{session}}=await SB.auth.getSession();
  if(!session)return afficher('connexion');
  await chargerProfil();
}
function afficher(e){for(const x of ['connexion','mdp','app'])$('#ecran-'+x).hidden=x!==e}

async function chargerProfil(){
  const {data:{user}}=await SB.auth.getUser();
  const {data:u}=await SB.from('utilisateurs').select('*').eq('email',(user?.email||'').toLowerCase()).maybeSingle();
  if(!u||!u.actif){await SB.auth.signOut();afficher('connexion');$('#c-erreur').textContent="Ce compte n'a pas accès à la plateforme. Contactez votre administrateur.";return}
  S.moi=u;
  if(u.doit_changer_mdp)return afficher('mdp');
  await chargerReferentiel();
  afficher('app');
  $('#h-moi').textContent=(u.nom||u.email)+' · '+ROLES[u.role];
  construireOnglets();ouvrir(S.onglet);
}
async function chargerReferentiel(){
  const [c,m]=await Promise.all([SB.from('clients').select('*').order('nom'),SB.from('marques').select('*').order('nom')]);
  S.clients=c.data||[];S.marques=m.data||[];
  const sel=$('#sel-client');
  const opts=(S.clients.length>1?'<option value="tous">Toutes les marques</option>':'')+S.clients.map(x=>`<option value="${x.id}">${esc(x.nom)}</option>`).join('');
  sel.innerHTML=opts||'<option value="tous">Aucune marque</option>';
  if(S.client!=='tous'&&!S.clients.some(x=>String(x.id)===String(S.client)))S.client='tous';
  if(S.clients.length===1)S.client=String(S.clients[0].id);
  sel.value=S.client;sel.closest('label').hidden=S.clients.length<1;
}
$('#sel-client').addEventListener('change',e=>{S.client=e.target.value;ouvrir(S.onglet)});

$('#f-connexion').addEventListener('submit',async e=>{
  e.preventDefault();$('#c-erreur').textContent='';$('#c-btn').disabled=true;
  const {error}=await SB.auth.signInWithPassword({email:$('#c-email').value.trim().toLowerCase(),password:$('#c-mdp').value});
  $('#c-btn').disabled=false;
  if(error){$('#c-erreur').textContent='Adresse ou mot de passe incorrect.';return}
  await chargerProfil();
});
$('#f-mdp').addEventListener('submit',async e=>{
  e.preventDefault();const a=$('#m-1').value,b=$('#m-2').value;
  if(a.length<10)return $('#m-erreur').textContent='Au moins 10 caractères.';
  if(a!==b)return $('#m-erreur').textContent='Les deux saisies ne sont pas identiques.';
  const {error}=await SB.auth.updateUser({password:a});
  if(error)return $('#m-erreur').textContent='Enregistrement impossible : '+error.message;
  await SB.rpc('compte_change_mdp');toast('Mot de passe enregistré');await chargerProfil();
});
$('#b-sortir').addEventListener('click',async()=>{await SB.auth.signOut();S.moi=null;afficher('connexion')});
$('#b-compte').addEventListener('click',()=>{S.moi.doit_changer_mdp=true;$('#m-1').value=$('#m-2').value='';$('#m-erreur').textContent='';afficher('mdp')});

// ===== Onglets =====
function construireOnglets(){
  const o=[['tableau','Tableau de bord'],['attention','Points d’attention'],['suivies','Publications suivies'],['publications','Publications'],['officiels','Canaux officiels'],['concurrents','Concurrents'],['rapports','Rapports']];
  if(estAdmin())o.push(['admin','Administration']);
  $('#onglets').innerHTML=o.map(([k,l])=>`<button role="tab" data-o="${k}" aria-selected="${k===S.onglet}">${l}<span class="compteur" id="n-${k}" hidden></span></button>`).join('');
  $('#onglets').querySelectorAll('button').forEach(b=>b.onclick=()=>ouvrir(b.dataset.o));
}
function quitterSansEnregistrer(){
  if(!S.modifie)return true;
  if(!confirm('Des modifications ne sont pas enregistrées. Quitter quand même ?'))return false;
  S.modifie=false;return true;
}
window.addEventListener('beforeunload',e=>{if(S.modifie){e.preventDefault();e.returnValue=''}});
function ouvrir(k){
  if(!quitterSansEnregistrer())return;
  if(!estAdmin()&&k==='admin')k='tableau';
  S.onglet=k;$('#onglets').querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',b.dataset.o===k));
  ({tableau:vueTableau,attention:()=>vueListe('attention'),suivies:()=>vueListe('suivies'),publications:()=>vueListe('publications'),officiels:()=>vueListe('officiels'),concurrents:()=>vueListe('concurrents'),rapports:vueRapports,admin:vueAdmin}[k]||vueTableau)();
}
const selPeriode=(id='f-periode')=>`<select id="${id}" aria-label="Période">${[24,48,72].map(n=>`<option value="${n}" ${S.periode===n?'selected':''}>Dernières ${n} heures</option>`).join('')}</select>`;
function filtreClient(q){return S.client==='tous'?q:q.eq('client_id',S.client)}
const nomMarque=id=>S.marques.find(m=>m.id===id)?.nom||'';
const nomClient=id=>S.clients.find(c=>c.id===id)?.nom||'';
function marquesVisibles(){return S.marques.filter(m=>S.client==='tous'||String(m.client_id)===String(S.client))}
const interactions=p=>(p.jaime||0)+(p.com||0)+(p.part||0);
const pct=(a,b)=>b?Math.round(a*100/b)+' %':'—';

// ===== Tableau de bord =====
// Camembert de la tonalité : pourcentages de positif, neutre et négatif
function camembert(pubs){
  const n={Positif:0,Neutre:0,'Négatif':0};pubs.forEach(p=>{if(p.sentiment in n)n[p.sentiment]++});
  const t=n.Positif+n.Neutre+n['Négatif'];if(!t)return '<p class="muted small">Aucune publication analysée sur la période.</p>';
  const P=k=>Math.round(n[k]*1000/t)/10,c={Positif:'var(--pos)',Neutre:'var(--neu)','Négatif':'var(--neg)'};
  let a=0;const parts=['Positif','Neutre','Négatif'].map(k=>{const d=n[k]*360/t,seg=`${c[k]} ${a}deg ${a+d}deg`;a+=d;return seg});
  return `<div class="camembert-vue"><div class="camembert-app" role="img" aria-label="Positif ${P('Positif')} %, neutre ${P('Neutre')} %, négatif ${P('Négatif')} %" style="background:conic-gradient(${parts.join(',')})"></div>
    <ul class="legende-app">${['Positif','Neutre','Négatif'].map(k=>`<li><i style="background:${c[k]}"></i><span>${k}</span><b class="num">${P(k).toLocaleString('fr-FR')} %</b><span class="muted small num">${n[k]} publication${n[k]>1?'s':''}</span></li>`).join('')}</ul></div>`;
}
async function vueTableau(){
  const c=$('#contenu');c.innerHTML='<section class="vue"><p class="muted">Chargement…</p></section>';
  const depuis=new Date(Date.now()-S.periode*36e5).toISOString();
  const [p24,att,suiv]=await Promise.all([
    filtreClient(SB.from('publications').select('id,marque_id,sentiment,jaime,com,part,type').gte('remontee_le',depuis).neq('type','concurrent').is('archive_le',null)),
    filtreClient(SB.from('publications').select('id,marque_id,auteur,titre,texte,plateforme,com,vues,epingle,attention_depuis,lien').eq('categorie','attention').neq('type','concurrent').order('epingle',{ascending:false}).order('attention_depuis',{ascending:false})),
    filtreClient(SB.from('publications').select('id',{count:'exact',head:true}).eq('categorie','suivie'))]);
  const pubs=p24.data||[],atts=att.data||[];
  const neg=pubs.filter(p=>p.sentiment==='Négatif').length,inter=pubs.reduce((s,p)=>s+interactions(p),0);
  const ms=marquesVisibles();

      <div class="chiffre ${tot('a')?'alerte':''}"><b class="num">${tot('a')}</b><span>points d'attention en cours</span></div>
    </div>
    ${S.clients.length?`<div class="defile"><table class="tab recap"><thead><tr><th>Marque</th><th class="n">Publications</th><th class="n">Évolution</th><th class="n">Négatives</th><th class="n">Interactions</th><th class="n">Points d'attention</th><th class="n">Suivies</th><th>Thème dominant</th><th>Dernier rapport</th></tr></thead><tbody>
    ${lignes.map(l=>`<tr><td><div class="marque-cell">${l.c.logo_url?`<img src="${esc(l.c.logo_url)}" alt="">`:''}<b>${esc(l.c.nom)}</b>${l.c.actif?'':' <span class="puce">Suspendue</span>'}</div></td><td class="n num">${l.n}</td><td class="n num">${tendance(l.ev)}</td><td class="n num">${pct(l.neg,l.n)}</td><td class="n num">${nb(l.inter)}</td><td class="n num">${l.a?`<span class="puce Négatif">${l.a}</span>`:'0'}</td><td class="n num">${l.s}</td><td class="small">${l.theme?esc(l.theme[0])+' ('+l.theme[1]+')':'—'}</td><td class="small num">${l.r?date(l.r.cree_le):'—'}</td></tr>`).join('')}
    </tbody></table></div><p class="muted small">Évolution : nombre de publications comparé aux ${h} heures précédentes.</p>`:'<p class="muted small">Aucune marque suivie.</p>'}</div>`;

function brancherLignes(racine,surChange){
  racine.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.classList.contains('ajouter')){const z=b.previousElementSibling;if(!z?.classList.contains('lignes'))return;
      const max=Number(z.dataset.max||0);if(max&&z.children.length>=max)return toast(`Au plus ${max} lignes.`,true);
      z.insertAdjacentHTML('beforeend',ligne(z.dataset.type));z.lastElementChild.querySelector('input,select')?.focus();surChange()}
    else if(b.classList.contains('retirer')){const l=b.closest('.ligne'),z=l.parentElement;
      if(z.children.length>1)l.remove();else l.querySelectorAll('input').forEach(i=>i.value='');surChange()}
  });
}

// ---- Requêtes booléennes : contrôle de la syntaxe (ET, OU, SAUF, "expression", parenthèses) ----
function controleRequete(q){
  if(!q)return '';
  if((q.match(/"/g)||[]).length%2)return 'guillemet non fermé';
  let p=0;for(const ch of q){if(ch==='(')p++;if(ch===')')p--;if(p<0)return 'parenthèse fermante en trop'}
  if(p)return 'parenthèse non fermée';
  const j=q.replace(/"[^"]*"/g,' X ').replace(/[()]/g,' ').trim().split(/\s+/);
  const op=t=>/^(ET|AND|OU|OR|SAUF|NOT)$/i.test(t);
  if(op(j[0]))return 'la requête ne peut pas commencer par un opérateur';
  if(op(j[j.length-1]))return 'la requête ne peut pas finir par un opérateur';
  for(let i=1;i<j.length;i++)if(op(j[i])&&op(j[i-1]))return 'deux opérateurs se suivent';
  // sigle court sans contexte : trop d'homonymes dans le monde (ex. « OCI »)
  if(!/\b(ET|AND|SAUF|NOT)\b/i.test(q)){
    const termes=q.replace(/\b(OU|OR)\b/gi,'|').split('|').map(t=>t.replace(/[()"]/g,'').trim()).filter(Boolean);
    const court=termes.find(t=>!/\s/.test(t)&&t.replace(/[^\p{L}\p{N}]/gu,'').length<=4);
    if(court)return `« ${court} » est un sigle court : précisez le contexte, par exemple ${court} ET (marque OU ville)`;
  }
  return '';
}

// ---- Propositions de mots-clés ----
function identifiantCompte(url){
  const u=String(url||'');
  const m=u.match(/tiktok\.com\/@([^/?#]+)/i)||u.match(/(?:x|twitter)\.com\/([^/?#]+)/i)||u.match(/facebook\.com\/(?:profile\.php\?id=\d+|pages\/[^/]+\/\d+|([^/?#]+))/i);
  const id=m&&m[1];if(!id||/^(profile\.php|pages|groups|people|share|watch|home)$/i.test(id))return '';
  return id;
}
function propositionsLocales(nom,comptes){
  const s=new Set();const n=String(nom||'').trim();
  if(n){s.add(/\s/.test(n)?`"${n}"`:n);
}
  for(const c of comptes||[]){const id=identifiantCompte(c.url);if(id&&id.length>=3){s.add('@'+id);const lisible=id.replace(/[._-]+/g,' ').replace(/([a-z])([A-Z])/g,'$1 $2').trim();if(/\s/.test(lisible))s.add(`"${lisible}"`)}}
  return [...s];
}

function etatPremierTour(f){
  if(!f)return '—';

  const c=f.controle||{};

}

    </tbody></table></div><div id="u-res2"></div></div>`;
  const AIDE={admin_agence:'Voit et paramètre toutes les marques de l’agence, et gère les comptes.',user_agence:'Responsable de comptes à l’agence : voit les marques cochées, reçoit leur rapport quotidien, peut suivre, épingler et signaler des points d’attention.',user_client:'Accès réservé à une marque : consultation de sa seule veille et réception de son rapport quotidien.',admin_plateforme:'Administration de la plateforme.',super_admin:'Accès complet.'};
  const maj=()=>{const r=$('#u-role').value;$('#u-un-client').hidden=r!=='user_client';$('#u-plusieurs').hidden=r!=='user_agence';$('#u-aide').textContent=AIDE[r]||''};$('#u-role').onchange=maj;maj();

  c.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{const j=await fonctionComptes({action:'reinitialiser',email:b.dataset.r});if(!j.ok)return toast(j.erreur,true);montrerMdp($('#u-res2'),b.dataset.r,j.mot_de_passe)});
  c.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{const u=us.find(x=>x.email===b.dataset.d);
    const j=await fonctionComptes({action:'modifier',email:u.email,nom:u.nom,role:u.role,client_id:u.client_id,clients:(uc||[]).filter(x=>x.email===u.email).map(x=>x.client_id),actif:!u.actif});
    if(!j.ok)return toast(j.erreur,true);toast(u.actif?'Compte désactivé':'Compte réactivé');vueComptes()});
  c.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>confirmer(b,'Supprimer ce compte ?',async()=>{const j=await fonctionComptes({action:'supprimer',email:b.dataset.x});if(!j.ok)return toast(j.erreur,true);toast('Compte supprimé');vueComptes()}));

// ===== Rapports =====
const jourHeure=v=>new Date(v).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'UTC'}).replace(' ',' à ')+' UTC';
const jour=v=>new Date(v).toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric',timeZone:'UTC'});
const versLocal=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,16);
async function vueRapports(){
  const c=$('#contenu');c.innerHTML='<section class="vue"><p class="muted">Chargement…</p></section>';
  const {data,error}=await filtreClient(SB.from('rapports').select('id,client_id,type,debut,fin,cree_le,cree_par,envoi_prevu,envoye_le')).order('cree_le',{ascending:false}).limit(100);
  const ms=S.clients.filter(x=>S.client==='tous'||String(x.id)===String(S.client));
  const maintenant=new Date();
  c.innerHTML=`<section class="vue"><div class="entete-vue"><h2>Rapports</h2></div>
    <form class="bloc" id="f-rapport"><h3>Générer un rapport</h3><p class="muted small" style="margin:0">Un rapport ne couvre qu’une seule marque.</p>
      <div class="row"><label>Marque<select id="r-marque">${ms.map(x=>`<option value="${x.id}">${esc(x.nom)}</option>`).join('')}</select></label>
      <label>Période<select id="r-periode"><option value="24">Dernières 24 heures</option><option value="48">Dernières 48 heures</option><option value="72">Dernières 72 heures</option><option value="perso">Dates choisies</option></select></label></div>
      <div class="row" id="r-dates" hidden><label>Du<input type="datetime-local" id="r-debut" value="${versLocal(new Date(maintenant-864e5))}"></label><label>Au<input type="datetime-local" id="r-fin" value="${versLocal(maintenant)}"></label></div>
      <div class="row"><button class="btn" type="submit" id="r-btn" ${ms.length?'':'disabled'}>Générer et télécharger</button></div></form>
    <div class="bloc"><h3>Rapports disponibles</h3><p class="muted small" style="margin:0">Le rapport quotidien de chaque marque est produit chaque matin. Son envoi par e-mail aux utilisateurs de la marque et aux responsables de comptes de l’agence sera activé à la mise en service.</p>
      ${error?'<p class="erreur">Chargement impossible : '+esc(error.message)+'</p>':(data||[]).length?`<div class="defile"><table class="tab"><thead><tr><th>Marque</th><th>Type</th><th>Période couverte</th><th>Produit le</th><th>Envoi</th><th></th></tr></thead><tbody>
      ${data.map(r=>`<tr><td><b>${esc(nomClient(r.client_id))}</b></td><td>${r.type==='quotidien'?'Quotidien':'À la demande'}</td><td class="small num">${jourHeure(r.debut)}<br>${jourHeure(r.fin)}</td><td class="small num">${jourHeure(r.cree_le)}</td><td class="small">${r.envoye_le?'Envoyé le '+jourHeure(r.envoye_le):r.type==='quotidien'?'Non envoyé (envoi désactivé)':'—'}</td><td style="text-align:right"><button class="btn mini" data-v="${r.id}">Télécharger le PDF</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted small">Aucun rapport pour l’instant.</p>'}</div></section>`;
  $('#r-periode').onchange=e=>$('#r-dates').hidden=e.target.value!=='perso';
  $('#f-rapport').onsubmit=async e=>{e.preventDefault();
    let fin=new Date(),debut;
    if($('#r-periode').value==='perso'){debut=new Date($('#r-debut').value);fin=new Date($('#r-fin').value);
      if(isNaN(debut)||isNaN(fin)||debut>=fin)return toast('Vérifiez les dates : le début doit précéder la fin.',true);
      if(fin-debut>31*864e5)return toast('La période ne peut pas dépasser 31 jours.',true)}
    else debut=new Date(fin-Number($('#r-periode').value)*36e5);
    $('#r-btn').disabled=true;
    const {data:id,error}=await SB.rpc('enregistrer_rapport_demande',{p_client:Number($('#r-marque').value),p_debut:debut.toISOString(),p_fin:fin.toISOString()});
    $('#r-btn').disabled=false;
    if(error)return toast(error.message,true);
    await vueRapports();telechargerRapport(id)};
  c.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>telechargerRapport(Number(b.dataset.v),b));
}

// Synthèse factuelle, utilisée quand le rapport n'a pas de synthèse rédigée (aucune interprétation, aucun qualificatif)
function syntheseAuto(d){
  const f=[],a=[];
  const reseaux=Object.entries(d.par_reseau||{}).sort((x,y)=>y[1]-x[1]);
  if(!d.total)f.push('Aucune publication sur la marque n’a été remontée pendant la période.');
  else{
    f.push(`${d.total} publication${d.total>1?'s':''} sur la marque remontée${d.total>1?'s':''}, dont ${d.negatives} négative${d.negatives>1?'s':''} (${pct(d.negatives,d.total)}).`);
    if(reseaux.length)f.push('Répartition par réseau : '+reseaux.map(([r,n])=>`${r} ${n}`).join(', ')+'.');
    const t=(d.themes||[]).filter(x=>x.theme!=='Non classé')[0];if(t)f.push(`Thématique la plus présente : ${t.theme} (${t.n} publication${t.n>1?'s':''}, ${nb(t.interactions)} interactions).`);
    const l=(d.lieux||[])[0];if(l)f.push(`Localité la plus citée : ${l.lieu} (${l.n}).`);
    const top=(d.publications||[])[0];if(top&&interactions(top))f.push(`Publication la plus engageante : ${top.auteur||'auteur non disponible'} sur ${top.plateforme} (${nb(interactions(top))} interactions).`);
  }
  for(const x of (d.attention||[]).slice(0,6))a.push(`${x.auteur||'Auteur non disponible'} (${x.plateforme})${x.titre?' : '+x.titre:''} · ${(x.motifs||[]).join(', ')||'point d’attention'} · ${x.statut||'en cours'}`);
  if(!a.length)a.push('Aucun point d’attention en cours.');
  return {faits:f,attention:a};
}

// ===== Rapport : organisation inspirée du rapport CIE, une seule marque, image de marque de la plateforme =====
// Construit les pages A4 du rapport (HTML) ; le PDF est produit à partir de ces pages
function pagesRapport(r){
  const d=r.contenu||{},syn=Object.assign(syntheseAuto(d),r.synthese||{});
  const nd=v=>v==null?'non disponible':nb(v);
  const tot=d.total||0,ton=d.tonalite||{};
  const quotidien=r.type==='quotidien';
  const titre=quotidien?'Rapport quotidien de veille':'Rapport de veille';
  const periode=`du ${jourHeure(r.debut)} au ${jourHeure(r.fin)}`;
  const dateR=jour(r.cree_le);
  const logoClient=d.logo?`<img src="${esc(d.logo)}" alt="${esc(d.marque)}">`:`<b>${esc(d.marque)}</b>`;
  const themes=(d.themes||[]),dominant=themes.find(x=>x.theme!=='Non classé');

  // graphiques
  const barres=(l,cle,lib)=>{const max=Math.max(1,...l.map(x=>x[cle]));return l.length?`<div class="barres">${l.map(x=>`<div class="barre"><span class="lib">${esc(x[lib])}</span><span class="piste"><i style="width:${Math.max(2,x[cle]*100/max)}%"></i></span><b class="num">${nb(x[cle])}</b></div>`).join('')}</div>`:'<p class="vide-r">Aucune donnée sur la période.</p>'};
  const nNeg=ton['Négatif']||0,nNeu=ton['Neutre']||0,nPos=ton['Positif']||0,nT=nNeg+nNeu+nPos;
  const a1=nT?nPos*360/nT:0,a2=nT?a1+nNeu*360/nT:0;
  const arc=(a,b,c)=>{if(b-a<=0)return '';if(b-a>=359.99)return `<circle cx="50" cy="50" r="48" fill="${c}"/>`;const p=t=>[50+48*Math.sin(t*Math.PI/180),50-48*Math.cos(t*Math.PI/180)].map(v=>v.toFixed(2)).join(' ');return `<path d="M50 50 L${p(a)} A48 48 0 ${b-a>180?1:0} 1 ${p(b)} Z" fill="${c}"/>`};
  const camemb=nT?`<svg class="camembert" viewBox="0 0 100 100" aria-hidden="true">${arc(0,a1,'#3DA56A')}${arc(a1,a2,'#A3A69C')}${arc(a2,360,'#E5484D')}</svg>
    <ul class="legende"><li><i style="background:var(--r-pos)"></i>Positif ${pct(nPos,nT)}</li><li><i style="background:var(--r-neu)"></i>Neutre ${pct(nNeu,nT)}</li><li><i style="background:var(--r-neg)"></i>Négatif ${pct(nNeg,nT)}</li></ul>`:'<p class="vide-r">Aucune publication analysée sur la période.</p>';
  const tr=d.tranches||[],maxT=Math.max(1,...tr.map(x=>x.n));
  const heure=t=>String(new Date(t).getUTCHours()).padStart(2,'0')+'h';
  const tranches=tr.length?`<div class="colonnes">${tr.map(x=>`<div class="col"><b class="num">${x.n}</b><span class="barre-v" style="height:${Math.max(2,x.n*100/maxT)}%"></span><span class="lib">${heure(x.debut)}</span></div>`).join('')}</div>`:'<p class="vide-r">Non disponible.</p>';
  const mots=d.mots||[],maxM=Math.max(1,...mots.map(x=>x.n)),minM=Math.min(...mots.map(x=>x.n),maxM);
  const nuage=mots.length?`<div class="nuage">${[...mots].sort((x,y)=>x.mot.localeCompare(y.mot,'fr')).map(x=>{const k=maxM===minM?.5:(x.n-minM)/(maxM-minM);return `<span style="font-size:${(.85+k*2.1).toFixed(2)}em;font-weight:${k>.5?700:500}" class="${k>.6?'fort':''}">${esc(x.mot)}</span>`}).join(' ')}</div>`:'<p class="vide-r">Aucun mot sur la période.</p>';

  // fiches
  const cartePub=p=>{const lien=lienSur(p.lien);return `<article class="r-pub ${esc(p.sentiment||'')}"><div class="r-pub-tete">${esc((p.plateforme||'').toUpperCase())}${p.attention?' · POINT D’ATTENTION':''}</div>
    ${p.capture?`<img class="r-capture" src="${esc(p.capture)}" alt="" loading="lazy">`:''}
    <div class="r-pub-corps"><b>${esc(p.auteur||'Auteur non disponible')}</b>
    <div class="r-dates">Publiée le ${p.publiee_le?jourHeure(p.publiee_le):'non disponible'} · remontée le ${p.remontee_le?jourHeure(p.remontee_le):'non disponible'}</div>
    ${p.titre?`<div class="r-titre">${esc(p.titre)}</div>`:''}<div class="r-texte ${p.capture?'court':'long'}">${esc(p.texte||'Texte non disponible.')}</div>
    <div class="r-stats num">${nd(p.jaime)} j'aime · ${nd(p.com)} commentaires · ${nd(p.part)} partages</div>
    <div class="r-tags">${[p.theme,p.lieu,p.sentiment].filter(Boolean).map(esc).join(' · ')||'Analyse non disponible'}</div>
    ${lien?`<a href="${esc(lien)}" target="_blank" rel="noopener">${esc(lien.length>70?lien.slice(0,70)+'…':lien)}</a>`:''}</div></article>`};
  const ficheAtt=x=>{const lien=lienSur(x.lien);return `<article class="r-att"><div class="r-pub-tete">${esc((x.plateforme||'').toUpperCase())} · POINT D’ATTENTION${x.epingle?' · ÉPINGLÉ':''}</div>
    <div class="r-att-corps">${x.capture?`<img class="r-att-capture" src="${esc(x.capture)}" alt="">`:''}
    <div class="r-att-infos"><b>${esc(x.auteur||'Auteur non disponible')}</b>
      <div class="r-dates">Publiée le ${x.publiee_le?jourHeure(x.publiee_le):'non disponible'} · remontée le ${x.remontee_le?jourHeure(x.remontee_le):'non disponible'}</div>
      <div class="r-motifs">${(x.motifs||[]).map(m=>`<span>${esc(m)}</span>`).join('')}<span class="statut">${esc(x.statut||'En cours')}</span></div>
      ${x.titre?`<div class="r-titre">${esc(x.titre)}</div>`:''}
      <div class="r-texte-plein">${x.texte?'« '+esc(x.texte)+' »':'Texte non disponible.'}</div>
      <div class="r-chiffres num"><span><b>${nd(x.jaime)}</b> j'aime</span><span><b>${nd(x.com)}</b> commentaires</span><span><b>${nd(x.part)}</b> partages</span><span><b>${nd(x.vues)}</b> vues</span></div>
      <div class="r-tags">${[x.theme,x.lieu,x.sentiment].filter(Boolean).map(esc).join(' · ')}</div>
      ${lien?`<a href="${esc(lien)}" target="_blank" rel="noopener">${esc(lien.length>80?lien.slice(0,80)+'…':lien)}</a>`:''}</div></div></article>`};

  // pages intérieures numérotées
  const interieures=[];
  const page=(section,corps,cls='')=>interieures.push({section,corps,cls});
  page('Synthèse',`<p class="r-periode"><b>Période couverte :</b> ${periode}</p>
    <div class="kpis"><div><b class="num">${nb(tot)}</b><span>publications remontées</span></div><div><b class="num">${pct(d.negatives||0,tot)}</b><span>de publications négatives</span></div><div><b class="num">${nb((d.jaime||0)+(d.com||0)+(d.part||0))}</b><span>interactions</span></div><div><b class="num">${(d.attention||[]).length}</b><span>points d’attention actifs</span></div></div>
    <h3>Faits marquants</h3><ul>${(syn.faits||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
    <h3>Points d’attention</h3><ul>${(syn.attention||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`);
  page('01 – Tableau de bord',`<div class="kpis cinq"><div><b class="num">${nb(tot)}</b><span>publications</span></div><div><b class="num">${pct(d.negatives||0,tot)}</b><span>négatives</span></div><div><b class="num">${nb((d.jaime||0)+(d.com||0)+(d.part||0))}</b><span>interactions</span></div><div><b class="num">${(d.attention||[]).length}</b><span>points d’attention actifs</span></div><div><b class="sm">${dominant?esc(dominant.theme):'non disponible'}</b><span>thème dominant</span></div></div>
    <h3>Publications par tranche de 3 heures</h3>${tranches}
    <div class="deux"><div><h3>Thématiques</h3>${barres(themes.slice(0,8),'n','theme')}</div><div><h3>Sens des publications</h3>${camemb}</div></div>
    <div class="kpis"><div><b class="num">${nb(d.jaime)}</b><span>j'aime</span></div><div><b class="num">${nb(d.com)}</b><span>commentaires</span></div><div><b class="num">${nb(d.part)}</b><span>partages</span></div><div><b class="num">${Object.keys(d.par_reseau||{}).length}</b><span>réseaux</span></div></div>`);
  page('01 – Tableau de bord (suite)',`<h3>Nuage de mots</h3>${nuage}
    <div class="deux"><div><h3>Localités citées</h3>${barres((d.lieux||[]).slice(0,10),'n','lieu')}</div><div><h3>Interactions par thématique</h3>${barres(themes.slice(0,10).map(x=>({theme:x.theme,i:x.interactions||0})),'i','theme')}</div></div>
    <h3>Publications par réseau</h3>${barres(Object.entries(d.par_reseau||{}).map(([k,v])=>({k,v})).sort((x,y)=>y.v-x.v),'v','k')}
    <p class="note">Base : publications publiques remontées sur la marque pendant la période, hors canaux officiels et concurrents ; mêmes chiffres que le tableau de bord de la plateforme.</p>`);
  // points d'attention : jamais coupés, un ou deux par page selon leur taille
  const att=d.attention||[];
  if(!att.length)page('02 – Points d’attention','<p class="vide-r">Aucun point d’attention en cours sur la période.</p>');
  else{let lot=[],poids=0;const vider=()=>{if(lot.length){page(interieures.some(p=>p.section.startsWith('02'))?'02 – Points d’attention (suite)':'02 – Points d’attention',`<div class="r-atts">${lot.map(ficheAtt).join('')}</div>`);lot=[];poids=0}};
    for(const x of att){const w=(x.texte||'').length>(x.capture?380:750)?2:1;if(poids+w>2)vider();lot.push(x);poids+=w}vider()}
  // publications remontées : 6 par page, deux colonnes
  const pubs=d.publications||[];
  if(!pubs.length)page('03 – Publications remontées','<p class="vide-r">Aucune publication sur la période.</p>');
  for(let i=0;i<pubs.length;i+=6)page(i?'03 – Publications remontées (suite)':'03 – Publications remontées',`<div class="r-pubs">${pubs.slice(i,i+6).map(cartePub).join('')}</div>`,'six');

  const total=interieures.length+3;
  const entete=s=>`<header class="r-entete"><img src="${esc(IMAGE.logo_url)}" alt="${esc(IMAGE.nom_agence)}"><div class="r-ent-titre"><h2>${esc(s)}</h2><span>${esc(d.marque)} · ${titre} du ${dateR}</span></div><div class="r-logo-client">${logoClient}</div></header>`;
  const pied=n=>`<footer class="r-pied"><span>Document confidentiel · usage interne</span><span>${n} / ${total}</span></footer>`;
  const nom=`${quotidien?'Rapport-quotidien':'Rapport'}-${d.marque}-${new Date(r.fin).toISOString().slice(0,10)}`.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9-]+/g,'-');
  return {nom,html:`    <section class="page couverture">
      <div class="motif" aria-hidden="true"></div>
      <div class="c-haut"><img class="c-logo" src="${esc(IMAGE.logo_url)}" alt="${esc(IMAGE.nom_agence)}"><span class="c-mention">Document confidentiel · usage interne, diffusion restreinte</span></div>
      <div class="c-titre"><span class="c-sur">Plateforme de veille réseaux sociaux</span><h1>${titre}</h1></div>
      <div class="c-bande">
        <dl><div><dt>Émis par</dt><dd>${esc(IMAGE.nom_agence)}</dd></div><div><dt>Marque</dt><dd>${esc(d.marque)}</dd></div><div><dt>Date</dt><dd>${dateR}</dd></div><div><dt>Période couverte</dt><dd>${periode}</dd></div></dl>
        <div class="c-conf">CONFIDENTIEL</div></div>
      <div class="c-client">${logoClient}</div>
    </section>
    <section class="page separation"><div class="motif" aria-hidden="true"></div><div class="sep-client">${logoClient}</div><p>${esc(d.marque)}</p>
      <ol class="sommaire"><li><span>Synthèse</span></li><li><span>01 – Tableau de bord</span></li><li><span>02 – Points d’attention</span></li><li><span>03 – Publications remontées</span></li></ol></section>
    ${interieures.map((p,i)=>`<section class="page ${p.cls}">${entete(p.section)}<div class="r-corps">${p.corps}</div>${pied(i+3)}</section>`).join('')}
    <section class="page dos"><div class="motif" aria-hidden="true"></div><img src="${esc(IMAGE.logo_url)}" alt="${esc(IMAGE.nom_agence)}"><p>${esc(IMAGE.nom_plateforme)}</p></section>
`};
}

// Téléchargement direct du PDF : on reste sur la plateforme, rien ne s'ouvre
const BIBLIOS=['https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js','https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'];
let biblios=null;
function chargerBiblios(){
  return biblios||(biblios=Promise.all(BIBLIOS.map(u=>new Promise((ok,ko)=>{const sc=document.createElement('script');sc.src=u;sc.crossOrigin='anonymous';sc.onload=ok;sc.onerror=()=>{biblios=null;ko(new Error('module PDF indisponible'))};document.head.appendChild(sc)}))));
}
let exportEnCours=false;
async function telechargerRapport(id,bouton){
  if(exportEnCours)return toast('Un PDF est déjà en préparation.');
  exportEnCours=true;if(bouton)bouton.disabled=true;
  const zone=document.createElement('div');zone.className='r-doc export';zone.setAttribute('aria-hidden','true');
  try{
    toast('Préparation du PDF…');
    const [{data:r,error}]=await Promise.all([SB.from('rapports').select('*').eq('id',id).single(),chargerBiblios()]);
    if(error)throw new Error(error.message);
    const {nom,html}=pagesRapport(r);
    zone.innerHTML=html;document.body.appendChild(zone);
    // captures des réseaux : passées par le relais d'images de la plateforme pour être lisibles dans le PDF
    zone.querySelectorAll('img.r-capture,img.r-att-capture').forEach(im=>{try{const u=new URL(im.getAttribute('src'),location.href);if(u.origin!==location.origin&&!u.hostname.endsWith('.supabase.co'))im.src=SB_URL+'/functions/v1/image?u='+encodeURIComponent(u.href)}catch{}});
    // images : une capture illisible est retirée (le texte de la publication reste affiché)
    await Promise.all([...zone.querySelectorAll('img')].map(im=>new Promise(fin=>{
      const t=new Image();t.crossOrigin='anonymous';t.onload=()=>fin();t.onerror=()=>{if(im.matches('.r-capture,.r-att-capture'))im.remove();else im.style.visibility='hidden';fin()};t.src=im.src;setTimeout(fin,8000)})));
    if(document.fonts?.ready)await document.fonts.ready;
    const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait',compress:true});
    const pages=[...zone.querySelectorAll('.page')];
    for(let i=0;i<pages.length;i++){
      toast(`Préparation du PDF… page ${i+1} sur ${pages.length}`);
      const cv=await window.html2canvas(pages[i],{scale:2,useCORS:true,backgroundColor:'#ffffff',logging:false});
      if(i)pdf.addPage();
      pdf.addImage(cv.toDataURL('image/jpeg',.88),'JPEG',0,0,210,297,undefined,'FAST');
    }
    pdf.save(nom+'.pdf');
    toast('PDF téléchargé');
  }catch(e){toast('Téléchargement impossible : '+e.message,true)}
  finally{zone.remove();exportEnCours=false;if(bouton)bouton.disabled=false}
}

SB.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'){S.moi=null;afficher('connexion')}});
demarrer();
