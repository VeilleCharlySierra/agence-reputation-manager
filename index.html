<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Reputation Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* Mise en page : bandeau de marque, barre d'onglets, colonne de travail unique ; couleurs fournies par les paramètres de la plateforme */
:root{
  --accent:#C6DD1F;            /* couleur principale de l'agence (paramètres) */
  --bg:#111111;                /* fond de l'agence (paramètres) */
  --panel:color-mix(in srgb,var(--bg) 88%,#ffffff 12%);
  --panel2:color-mix(in srgb,var(--bg) 80%,#ffffff 20%);
  --line:color-mix(in srgb,var(--bg) 72%,#ffffff 28%);
  --fg:#F2F3EE;
  --muted:#A9AD9F;
  --on-accent:#111111;
  --neg:#FF6B5B; --neu:#9AA0A6; --pos:#5FD38D; --warn:#F5B941;
  --display:"Space Grotesk","Segoe UI",system-ui,sans-serif;
  --text:"Inter","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--text)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:78rem;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Boutons et champs */
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.btn.sec{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.sec:hover{border-color:var(--accent)}
.btn.danger{background:transparent;color:var(--neg);border:1px solid color-mix(in srgb,var(--neg) 50%,transparent)}
.btn.mini{padding:4px 9px;font-size:.8rem}
input[type=text],input[type=email],input[type=password],input[type=number],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
textarea{min-height:70px;resize:vertical}
label{display:grid;gap:4px;font-size:.85rem;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.row>*{flex:1 1 180px;min-width:0}
.row>.btn{flex:0 0 auto}

/* Connexion : carte centrée sur fond de marque, motif du logo en filigrane */
.ecran-marque{position:relative;min-height:100vh;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden;isolation:isolate}
.filigrane{position:absolute;inset:0;z-index:-1;pointer-events:none}
.filigrane i{position:absolute;display:block;background-image:var(--motif);background-repeat:no-repeat;background-size:contain;background-position:center}
.filigrane .grappe{background-repeat:repeat;background-size:42px auto;opacity:.13;
  -webkit-mask-image:radial-gradient(closest-side,#000 35%,transparent 100%);mask-image:radial-gradient(closest-side,#000 35%,transparent 100%)}
.filigrane .g1{top:-40px;right:-30px;width:380px;height:300px}
.filigrane .g2{bottom:-50px;left:-40px;width:340px;height:280px}
.filigrane .geant{opacity:.045}
.filigrane .s1{width:420px;height:420px;left:-150px;top:8%;transform:rotate(-14deg)}
.filigrane .s2{width:300px;height:300px;right:-90px;bottom:6%;transform:rotate(12deg)}
.filigrane .s3{width:110px;height:110px;right:14%;top:12%;transform:rotate(18deg);opacity:.08}
.filigrane .s4{width:84px;height:84px;left:16%;bottom:12%;transform:rotate(-20deg);opacity:.08}
.filigrane .halo{inset:auto;left:50%;top:50%;width:760px;height:760px;max-width:160vw;transform:translate(-50%,-50%);background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 16%,transparent),transparent 72%)}
.carte-connexion{width:min(420px,100%);display:grid;gap:18px;justify-items:stretch;text-align:center;
  background:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border:1px solid color-mix(in srgb,var(--accent) 28%,var(--line));border-radius:18px;padding:40px 36px 32px;
  box-shadow:0 30px 80px rgba(0,0,0,.55)}
.carte-connexion .logo{max-height:96px;max-width:min(260px,100%);justify-self:center;object-fit:contain}
.carte-connexion h1{font-size:1.2rem;letter-spacing:.02em;font-weight:500}
.carte-connexion .trait{width:44px;height:2px;background:var(--accent);justify-self:center;border-radius:2px;margin-top:-6px}
.carte-connexion label{text-align:left}
.carte-connexion input{padding:11px 12px;background:color-mix(in srgb,var(--bg) 85%,#000)}
.carte-connexion .btn{padding:12px 14px;font-size:1rem;border-radius:8px;letter-spacing:.01em}
.carte-connexion .aide{font-size:.8rem;color:var(--muted);margin:0}
.erreur{color:var(--neg);font-size:.88rem;min-height:1.2em;margin:-6px 0}
@media (max-width:520px){.carte-connexion{padding:32px 22px 26px}.filigrane .g1,.filigrane .g2{width:220px;height:180px}.filigrane .s1{width:260px;height:260px}}
/* En-tête */
header.haut{border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header.haut .wrap{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding-block:10px}
.marque{display:flex;align-items:center;gap:12px;min-width:0}
.marque img{height:38px;max-width:160px;object-fit:contain}
.marque h1{font-size:1.15rem;line-height:1.1}
.marque .agence{font-size:.75rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.compte{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.85rem}
.compte select{width:auto;padding:5px 8px}
nav.onglets{border-bottom:1px solid var(--line)}
nav.onglets .wrap{display:flex;gap:4px;overflow-x:auto}
nav.onglets button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:10px 12px;cursor:pointer;white-space:nowrap;font-weight:500}
nav.onglets button[aria-selected=true]{color:var(--fg);border-bottom-color:var(--accent)}
nav.onglets .compteur{display:inline-block;min-width:1.4em;margin-left:5px;padding:0 5px;border-radius:9px;background:var(--panel2);font-size:.75rem;color:var(--fg)}
main{padding-block:20px 48px}
section.vue{display:grid;gap:16px}
.entete-vue{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
.entete-vue h2{font-size:1.3rem}

/* Tableau de bord */
.chiffres{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.chiffre{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
.chiffre b{display:block;font:700 1.8rem/1.1 var(--display)}
.chiffre span{font-size:.82rem;color:var(--muted)}
.chiffre.alerte{border-color:color-mix(in srgb,var(--neg) 60%,var(--line))}
.par-marque{width:100%;border-collapse:collapse;font-size:.9rem}
.par-marque th,.par-marque td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
.par-marque th{color:var(--muted);font-weight:500;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
.par-marque td.n{text-align:right}
.defile{overflow-x:auto}

/* Publications */
.filtres{display:flex;flex-wrap:wrap;gap:8px}
.filtres select,.filtres input{width:auto;min-width:0}
.liste{display:grid;gap:10px}
.pub{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:8px;min-width:0}
.pub.Négatif{border-left-color:var(--neg)}
.pub.Positif{border-left-color:var(--pos)}
.pub.epingle{box-shadow:0 0 0 1px var(--accent)}
.pub .meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.8rem;color:var(--muted)}
.pub .meta b{color:var(--fg);font-weight:600}
.pub .txt{overflow-wrap:anywhere}
.pub .stats{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.82rem}
.pub .actions{display:flex;flex-wrap:wrap;gap:6px}
.pub img.capture{max-width:min(320px,100%);border-radius:6px;border:1px solid var(--line)}
.puce{display:inline-block;padding:1px 8px;border-radius:10px;font-size:.75rem;font-weight:600;background:var(--panel2)}
.puce.Négatif{color:var(--neg)} .puce.Positif{color:var(--pos)} .puce.Neutre{color:var(--neu)}
.puce.acc{background:var(--accent);color:var(--on-accent)}
.vide{border:1px dashed var(--line);border-radius:8px;padding:28px 20px;text-align:center;color:var(--muted)}

/* Administration */
.admin-grille{display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:start}
.admin-menu{display:grid;gap:2px;position:sticky;top:120px}
.admin-menu button{background:none;border:0;text-align:left;padding:8px 10px;border-radius:6px;color:var(--muted);cursor:pointer}
.admin-menu button[aria-current=true]{background:var(--panel);color:var(--fg)}
.bloc{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:12px;min-width:0}
.bloc h3{font-size:1.02rem}
table.tab{width:100%;border-collapse:collapse;font-size:.88rem}
table.tab th,table.tab td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.tab th{color:var(--muted);font-weight:500;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.mdp{font:600 1.05rem/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--accent);border-radius:6px;padding:8px 10px;user-select:all}
.confirmation{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:color-mix(in srgb,var(--neg) 12%,var(--panel));border-radius:6px;padding:8px 10px;font-size:.85rem}
.clients-coches{display:flex;flex-wrap:wrap;gap:6px 14px}
.clients-coches label{display:flex;flex-direction:row;gap:6px;align-items:center;color:var(--fg)}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 14px;max-width:min(420px,calc(100vw - 32px));z-index:20}
.toast.ko{border-color:var(--neg)}
@media (max-width:720px){.admin-grille{grid-template-columns:1fr}.admin-menu{position:static;display:flex;flex-wrap:wrap}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<!-- ===== Connexion ===== -->
<div id="ecran-connexion" class="ecran-marque" hidden>
  <div class="filigrane" aria-hidden="true"><i class="halo"></i><i class="grappe g1"></i><i class="grappe g2"></i><i class="geant s1"></i><i class="geant s2"></i><i class="s3"></i><i class="s4"></i></div>
  <form class="carte-connexion" id="f-connexion" novalidate>
    <img class="logo" id="c-logo" alt="" hidden>
    <h1 id="c-titre">Reputation Manager</h1>
    <div class="trait"></div>
    <label>Adresse e-mail<input type="email" id="c-email" autocomplete="username" required></label>
    <label>Mot de passe<input type="password" id="c-mdp" autocomplete="current-password" required></label>
    <div class="erreur" id="c-erreur" role="alert"></div>
    <button class="btn" type="submit" id="c-btn">Se connecter</button>
    <p class="aide">Mot de passe oublié : votre administrateur peut le réinitialiser.</p>
  </form>
</div>

<!-- ===== Changement de mot de passe obligatoire ===== -->
<div id="ecran-mdp" hidden>
  <div class="ecran-marque">
    <div class="filigrane" aria-hidden="true"><i class="halo"></i><i class="grappe g1"></i><i class="grappe g2"></i><i class="geant s1"></i><i class="geant s2"></i><i class="s3"></i><i class="s4"></i></div>
    <form class="carte-connexion" id="f-mdp" novalidate>
      <h1>Choisissez votre mot de passe</h1><div class="trait"></div>
      <p class="muted small">Le mot de passe reçu était provisoire. Choisissez-en un d'au moins 10 caractères.</p>
      <label>Nouveau mot de passe<input type="password" id="m-1" autocomplete="new-password"></label>
      <label>Confirmer<input type="password" id="m-2" autocomplete="new-password"></label>
      <div class="erreur" id="m-erreur" role="alert"></div>
      <button class="btn" type="submit">Enregistrer et continuer</button>
    </form>
  </div>
</div>

<!-- ===== Application ===== -->
<div id="ecran-app" hidden>
  <header class="haut">
    <div class="wrap">
      <div class="marque">
        <img id="h-logo" alt="" hidden>
        <div><h1 id="h-titre">Reputation Manager</h1><div class="agence" id="h-agence"></div></div>
      </div>
      <div class="compte">
        <label class="small" style="display:flex;flex-direction:row;align-items:center;gap:6px">Marque
          <select id="sel-client"></select></label>
        <span id="h-moi" class="muted"></span>
        <button class="btn sec mini" id="b-compte" type="button">Mon compte</button>
        <button class="btn sec mini" id="b-sortir" type="button">Se déconnecter</button>
      </div>
    </div>
  </header>
  <nav class="onglets" aria-label="Sections"><div class="wrap" id="onglets" role="tablist"></div></nav>
  <main class="wrap" id="contenu"></main>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
// ===== Configuration de la plateforme =====
const SB_URL='https://quheqdljsycelutylyts.supabase.co';
const SB_CLE='sb_publishable_q0M1LL74FcfKCbvzPoBy3Q_FUmXvKfV';
const SB=supabase.createClient(SB_URL,SB_CLE,{auth:{persistSession:true,autoRefreshToken:true,storage:window.localStorage}});

const ROLES={super_admin:'Super administrateur',admin_plateforme:'Administrateur plateforme',admin_agence:'Administrateur agence',user_agence:'Utilisateur agence',user_client:'Accès marque'};
const GERE={super_admin:Object.keys(ROLES),admin_plateforme:['admin_agence','user_agence','user_client'],admin_agence:['admin_agence','user_agence','user_client']};
const S={moi:null,clients:[],marques:[],client:'tous',periode:24,onglet:'tableau',admin:'marques',adminMarque:null};
// Image de marque : fixée dans le code source, jamais modifiable depuis la plateforme
const IMAGE={nom_plateforme:'Totem Reputation Manager',nom_agence:'Totem Experience',couleur_principale:'#C6DD1F',couleur_fond:'#111111',logo_url:'img/logo-totem.png',motif_url:'img/motif-tx.png'};

const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nb=v=>v==null?'—':Number(v).toLocaleString('fr-FR');
const date=v=>v?new Date(v).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',timeZone:'UTC'}).replace(' ',' à ')+' UTC':'non disponible';
const estAdmin=()=>['super_admin','admin_plateforme','admin_agence'].includes(S.moi?.role);
const estOperateur=()=>['super_admin','admin_plateforme'].includes(S.moi?.role);
const peutAgir=()=>S.moi&&S.moi.role!=='user_client';
let tt;function toast(m,ko){const t=$('#toast');t.textContent=m;t.className='toast'+(ko?' ko':'');t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,ko?7000:3500)}
function lienSur(u){const s=String(u||'').trim();if(!s)return '';const h=/^https?:\/\//i.test(s)?s:'https://'+s;return /^https?:\/\//i.test(h)?h:''}

// ===== Image de marque =====
function appliquerMarque(p){
  if(!p)return;
  const r=document.documentElement.style;
  if(/^#[0-9a-f]{6}$/i.test(p.couleur_principale||''))r.setProperty('--accent',p.couleur_principale);
  if(/^#[0-9a-f]{6}$/i.test(p.couleur_fond||''))r.setProperty('--bg',p.couleur_fond);
  // texte sur la couleur principale : noir ou blanc selon sa clarté
  const h=(p.couleur_principale||'#C6DD1F').slice(1),l=(parseInt(h.slice(0,2),16)*299+parseInt(h.slice(2,4),16)*587+parseInt(h.slice(4,6),16)*114)/1000;
  r.setProperty('--on-accent',l>140?'#111111':'#FFFFFF');
  document.title=p.nom_plateforme||'Reputation Manager';
  for(const id of ['c-titre','h-titre'])$('#'+id).textContent=p.nom_plateforme||'Reputation Manager';
  $('#h-agence').textContent=p.nom_agence||'';
  const motif=p.motif_url||p.logo_url;if(motif)r.setProperty('--motif','url("'+motif.replace(/"/g,'')+'")');
  for(const id of ['c-logo','h-logo']){const im=$('#'+id);if(p.logo_url){im.src=p.logo_url;im.alt=p.nom_agence||'';im.hidden=false}else im.hidden=true}
}

// ===== Démarrage =====
async function demarrer(){
  appliquerMarque(IMAGE);
  const {data:{session}}=await SB.auth.getSession();
  if(!session)return afficher('connexion');
  await chargerProfil();
}
function afficher(e){for(const x of ['connexion','mdp','app'])$('#ecran-'+x).hidden=x!==e}

async function chargerProfil(){
  const {data:{user}}=await SB.auth.getUser();
  const {data:u}=await SB.from('utilisateurs').select('*').eq('email',(user?.email||'').toLowerCase()).maybeSingle();
  if(!u||!u.actif){await SB.auth.signOut();afficher('connexion');$('#c-erreur').textContent="Ce compte n'a pas accès à la plateforme. Contactez votre administrateur.";return}
  S.moi=u;
  if(u.doit_changer_mdp)return afficher('mdp');
  await chargerReferentiel();
  afficher('app');
  $('#h-moi').textContent=(u.nom||u.email)+' · '+ROLES[u.role];
  construireOnglets();ouvrir(S.onglet);
}
async function chargerReferentiel(){
  const [c,m]=await Promise.all([SB.from('clients').select('*').order('nom'),SB.from('marques').select('*').order('nom')]);
  S.clients=c.data||[];S.marques=m.data||[];
  const sel=$('#sel-client');
  const opts=(S.clients.length>1?'<option value="tous">Toutes les marques</option>':'')+S.clients.map(x=>`<option value="${x.id}">${esc(x.nom)}</option>`).join('');
  sel.innerHTML=opts||'<option value="tous">Aucune marque</option>';
  if(S.client!=='tous'&&!S.clients.some(x=>String(x.id)===String(S.client)))S.client='tous';
  if(S.clients.length===1)S.client=String(S.clients[0].id);
  sel.value=S.client;sel.closest('label').hidden=S.clients.length<1;
}
$('#sel-client').addEventListener('change',e=>{S.client=e.target.value;ouvrir(S.onglet)});

$('#f-connexion').addEventListener('submit',async e=>{
  e.preventDefault();$('#c-erreur').textContent='';$('#c-btn').disabled=true;
  const {error}=await SB.auth.signInWithPassword({email:$('#c-email').value.trim().toLowerCase(),password:$('#c-mdp').value});
  $('#c-btn').disabled=false;
  if(error){$('#c-erreur').textContent='Adresse ou mot de passe incorrect.';return}
  await chargerProfil();
});
$('#f-mdp').addEventListener('submit',async e=>{
  e.preventDefault();const a=$('#m-1').value,b=$('#m-2').value;
  if(a.length<10)return $('#m-erreur').textContent='Au moins 10 caractères.';
  if(a!==b)return $('#m-erreur').textContent='Les deux saisies ne sont pas identiques.';
  const {error}=await SB.auth.updateUser({password:a});
  if(error)return $('#m-erreur').textContent='Enregistrement impossible : '+error.message;
  await SB.rpc('compte_change_mdp');toast('Mot de passe enregistré');await chargerProfil();
});
$('#b-sortir').addEventListener('click',async()=>{await SB.auth.signOut();S.moi=null;afficher('connexion')});
$('#b-compte').addEventListener('click',()=>{S.moi.doit_changer_mdp=true;$('#m-1').value=$('#m-2').value='';$('#m-erreur').textContent='';afficher('mdp')});

// ===== Onglets =====
function construireOnglets(){
  const o=[['tableau','Tableau de bord'],['attention','Points d’attention'],['suivies','Publications suivies'],['publications','Publications'],['officiels','Canaux officiels'],['concurrents','Concurrents']];
  if(estAdmin())o.push(['admin','Administration']);
  if(S.moi.role==='super_admin')o.push(['journal','Journal']);
  $('#onglets').innerHTML=o.map(([k,l])=>`<button role="tab" data-o="${k}" aria-selected="${k===S.onglet}">${l}<span class="compteur" id="n-${k}" hidden></span></button>`).join('');
  $('#onglets').querySelectorAll('button').forEach(b=>b.onclick=()=>ouvrir(b.dataset.o));
}
function ouvrir(k){
  S.onglet=k;$('#onglets').querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',b.dataset.o===k));
  ({tableau:vueTableau,attention:()=>vueListe('attention'),suivies:()=>vueListe('suivies'),publications:()=>vueListe('publications'),officiels:()=>vueListe('officiels'),concurrents:()=>vueListe('concurrents'),admin:vueAdmin,journal:vueJournal}[k]||vueTableau)();
}
const selPeriode=()=>`<select id="f-periode" aria-label="Période">${[24,48,72].map(n=>`<option value="${n}" ${S.periode===n?'selected':''}>Dernières ${n} heures</option>`).join('')}</select>`;
function filtreClient(q){return S.client==='tous'?q:q.eq('client_id',S.client)}
const nomMarque=id=>S.marques.find(m=>m.id===id)?.nom||'';
const nomClient=id=>S.clients.find(c=>c.id===id)?.nom||'';
function marquesVisibles(){return S.marques.filter(m=>S.client==='tous'||String(m.client_id)===String(S.client))}

// ===== Tableau de bord =====
async function vueTableau(){
  const c=$('#contenu');c.innerHTML='<section class="vue"><p class="muted">Chargement…</p></section>';
  const depuis=new Date(Date.now()-S.periode*36e5).toISOString();
  const [p24,att,suiv]=await Promise.all([
    filtreClient(SB.from('publications').select('id,marque_id,sentiment,jaime,com,part,type').gte('remontee_le',depuis).neq('type','concurrent').is('archive_le',null)),
    filtreClient(SB.from('publications').select('id,marque_id,auteur,titre,texte,plateforme,com,vues,epingle,attention_depuis,lien').eq('categorie','attention').neq('type','concurrent').order('epingle',{ascending:false}).order('attention_depuis',{ascending:false})),
    filtreClient(SB.from('publications').select('id',{count:'exact',head:true}).eq('categorie','suivie'))]);
  const pubs=p24.data||[],atts=att.data||[];
  const neg=pubs.filter(p=>p.sentiment==='Négatif').length,inter=pubs.reduce((s,p)=>s+(p.jaime||0)+(p.com||0)+(p.part||0),0);
  const ms=marquesVisibles();
  const lignes=ms.map(m=>{const l=pubs.filter(p=>p.marque_id===m.id),n=l.filter(p=>p.sentiment==='Négatif').length;
    return `<tr><td>${esc(m.nom)}</td><td class="n num">${l.length}</td><td class="n num">${l.length?Math.round(n*100/l.length)+' %':'—'}</td><td class="n num">${nb(l.reduce((s,p)=>s+(p.jaime||0)+(p.com||0)+(p.part||0),0))}</td><td class="n num">${atts.filter(a=>a.marque_id===m.id).length}</td></tr>`}).join('');
  const titreClient=S.client==='tous'?'Toutes les marques':nomClient(Number(S.client));
  c.innerHTML=`<section class="vue">
    <div class="entete-vue"><h2>Tableau de bord</h2><div class="filtres"><span class="muted small" style="align-self:center">${esc(titreClient)}</span>${selPeriode()}</div></div>
    <div class="chiffres">
      <div class="chiffre"><b class="num">${pubs.length}</b><span>publications remontées</span></div>
      <div class="chiffre"><b class="num">${pubs.length?Math.round(neg*100/pubs.length)+' %':'—'}</b><span>de publications négatives</span></div>
      <div class="chiffre"><b class="num">${nb(inter)}</b><span>interactions (j'aime, commentaires, partages)</span></div>
      <div class="chiffre ${atts.length?'alerte':''}"><b class="num">${atts.length}</b><span>points d'attention en cours</span></div>
      <div class="chiffre"><b class="num">${suiv.count||0}</b><span>publications suivies</span></div>
    </div>
    ${ms.length?`<div class="bloc"><h3>Par marque</h3><div class="defile"><table class="par-marque"><thead><tr><th>Marque</th><th class="n">Publications</th><th class="n">Négatives</th><th class="n">Interactions</th><th class="n">Points d'attention</th></tr></thead><tbody>${lignes}</tbody></table></div></div>`
      :`<div class="vide">Aucune marque suivie pour l'instant.${estAdmin()?'<br>Ajoutez une marque et paramétrez sa veille dans <a href="#" id="va-admin">Administration</a>.':''}</div>`}
    <div class="bloc"><h3>Points d'attention</h3>${atts.length?'<div class="liste">'+atts.slice(0,5).map(a=>`<div class="small"><span class="puce acc">${esc(nomMarque(a.marque_id))}</span> ${a.epingle?'<span class="puce">Épinglé</span> ':''}<b>${esc(a.auteur||'Auteur inconnu')}</b> · ${esc(a.plateforme)} · ${esc(a.titre||(a.texte||'').slice(0,120))} · <span class="num">${nb(a.com)}</span> commentaires</div>`).join('')+'</div>':'<p class="muted small">Aucun point d’attention en cours.</p>'}</div>
  </section>`;
  $('#f-periode').onchange=e=>{S.periode=Number(e.target.value);vueTableau()};
  const va=$('#va-admin');if(va)va.onclick=e=>{e.preventDefault();ouvrir('admin')};
  const n=$('#n-attention');if(n){n.textContent=atts.length;n.hidden=!atts.length}
}

// ===== Listes de publications =====
const VUES={
  attention:{titre:'Points d’attention',q:q=>q.eq('categorie','attention').neq('type','concurrent').or('statut_suivi.is.null,statut_suivi.neq."Alerte close",attention_close_le.gte.'+new Date(Date.now()-864e5).toISOString()).order('epingle',{ascending:false}).order('attention_depuis',{ascending:false}),vide:'Aucun point d’attention en cours.'},
  suivies:{titre:'Publications suivies',q:q=>q.eq('categorie','suivie').neq('type','concurrent').order('suivie_le',{ascending:false}),vide:'Aucune publication suivie. Utilisez « Suivre » sur une publication pour relever ses statistiques à chaque passage.'},
  publications:{titre:'Publications',periode:true,q:q=>q.eq('categorie','publication').eq('type','remontee').order('remontee_le',{ascending:false}),vide:'Aucune publication pour l’instant.'},
  concurrents:{titre:'Concurrents',periode:true,q:q=>q.eq('type','concurrent').order('publiee_le',{ascending:false}),vide:'Aucune publication de concurrent pour l\u2019instant. Les concurrents se déclarent dans le paramétrage de chaque marque.'},
  officiels:{titre:'Canaux officiels',periode:true,q:q=>q.eq('categorie','publication').eq('type','officiel').order('publiee_le',{ascending:false}),vide:'Aucune publication des canaux officiels pour l’instant.'}
};
async function vueListe(k){
  const v=VUES[k],c=$('#contenu');
  c.innerHTML=`<section class="vue"><div class="entete-vue"><h2>${v.titre}</h2>
    <div class="filtres"><select id="f-marque" aria-label="Marque"><option value="">Toutes les marques</option>${marquesVisibles().map(m=>`<option value="${m.id}">${esc(m.nom)}</option>`).join('')}</select>
    <select id="f-sent" aria-label="Tonalité"><option value="">Toutes tonalités</option><option>Négatif</option><option>Neutre</option><option>Positif</option></select>
    <select id="f-pf" aria-label="Réseau"><option value="">Tous réseaux</option><option>Facebook</option><option>TikTok</option><option>X</option></select>${v.periode?selPeriode():''}</div></div>
    <div class="liste" id="liste"><p class="muted">Chargement…</p></div></section>`;
  const charger=async()=>{
    let q=filtreClient(v.q(SB.from('publications').select('*'))).is('archive_le',null).limit(200);
    if(v.periode){const x=new Date(Date.now()-S.periode*36e5).toISOString();q=q.or(`publiee_le.gte.${x},and(publiee_le.is.null,remontee_le.gte.${x})`)}
    const fm=$('#f-marque').value,fs=$('#f-sent').value,fp=$('#f-pf').value;
    if(fm)q=q.eq('marque_id',fm);if(fs)q=q.eq('sentiment',fs);if(fp)q=q.eq('plateforme',fp);
    const {data,error}=await q;
    if(error){$('#liste').innerHTML='<p class="erreur">Chargement impossible : '+esc(error.message)+'</p>';return}
    $('#liste').innerHTML=data.length?data.map(carte).join(''):`<div class="vide">${v.vide}</div>`;
    $('#liste').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>agir(b.dataset.id,b.dataset.a));
  };
  ['f-marque','f-sent','f-pf'].forEach(i=>$('#'+i).onchange=charger);
  if($('#f-periode'))$('#f-periode').onchange=e=>{S.periode=Number(e.target.value);charger()};charger();
}
function carte(p){
  const lien=lienSur(p.lien);
  const act=peutAgir()?[
    p.categorie==='publication'?`<button class="btn sec mini" data-a="suivre" data-id="${p.id}">Suivre</button><button class="btn sec mini" data-a="attention" data-id="${p.id}">Mettre en point d'attention</button>`:'',
    p.categorie==='suivie'?`<button class="btn sec mini" data-a="ne_plus_suivre" data-id="${p.id}">Ne plus suivre</button><button class="btn sec mini" data-a="attention" data-id="${p.id}">Mettre en point d'attention</button>`:'',
    p.categorie==='attention'?(p.epingle?`<button class="btn sec mini" data-a="desepingler" data-id="${p.id}">Désépingler</button>`:`<button class="btn sec mini" data-a="epingler" data-id="${p.id}">Épingler</button>`)+`<button class="btn sec mini" data-a="retirer_attention" data-id="${p.id}">Retirer des points d'attention</button>`:''
  ].join(''):'';
  return `<article class="pub ${esc(p.sentiment||'')} ${p.epingle?'epingle':''}">
    <div class="meta"><span class="puce acc">${esc(nomMarque(p.marque_id))}</span>${p.type==='concurrent'?'<span class="puce">Concurrent</span>':''}${p.sentiment?`<span class="puce ${esc(p.sentiment)}">${esc(p.sentiment)}</span>`:''}
      <span><b>${esc(p.auteur||'Auteur inconnu')}</b> · ${esc(p.plateforme)}</span>
      <span>${p.origine==='humaine'?'Remontée humaine':'Remontée automatisée'}</span>
      ${p.theme?`<span>${esc(p.theme)}</span>`:''}${p.lieu?`<span>${esc(p.lieu)}</span>`:''}</div>
    ${p.categorie==='attention'?`<div class="meta">${p.epingle?'<span class="puce acc">Épinglé</span>':''}${p.statut_suivi?`<span class="puce">${esc(p.statut_suivi)}</span>`:''}${(p.motifs||[]).map(m=>`<span>${esc(m)}</span>`).join(' · ')}</div>`:''}
    ${p.titre?`<div><b>${esc(p.titre)}</b></div>`:''}
    ${p.texte?`<div class="txt">${esc(p.texte)}</div>`:''}
    ${p.capture?`<img class="capture" loading="lazy" src="${esc(p.capture)}" alt="Capture de la publication">`:''}
    <div class="stats num"><span>${nb(p.jaime)} j'aime</span><span>${nb(p.com)} commentaires</span><span>${nb(p.part)} partages</span><span>${nb(p.vues)} vues</span></div>
    <div class="meta"><span>Publiée le ${date(p.publiee_le)}</span><span>${p.categorie==='publication'?'Remontée le '+date(p.remontee_le):'Dernier passage le '+date(p.dernier_releve_le||p.remontee_le)}</span>${lien?`<a href="${esc(lien)}" target="_blank" rel="noopener">Voir la publication</a>`:''}</div>
    ${act?`<div class="actions">${act}</div>`:''}
  </article>`;
}
async function agir(id,a){
  const {error}=await SB.rpc('action_publication',{p_id:Number(id),p_action:a});
  if(error)return toast(error.message,true);
  toast({suivre:'Publication suivie',ne_plus_suivre:'Publication retirée du suivi',attention:'Ajoutée aux points d’attention',retirer_attention:'Retirée des points d’attention',epingler:'Point d’attention épinglé',desepingler:'Point d’attention désépinglé'}[a]||'Fait');
  ouvrir(S.onglet);
}

// ===== Administration =====
function vueAdmin(){
  const sections=[['marques','Marques suivies'],['comptes','Comptes']];
  if(S.admin==='marque'&&!S.clients.some(c=>c.id===S.adminMarque))S.admin='marques';
  $('#contenu').innerHTML=`<section class="vue"><div class="entete-vue"><h2>Administration</h2></div>
    <div class="admin-grille"><div class="admin-menu">${sections.map(([k,l])=>`<button data-s="${k}" aria-current="${k===S.admin||(k==='marques'&&S.admin==='marque')}">${l}</button>`).join('')}</div><div id="admin-corps" style="display:grid;gap:16px;min-width:0"></div></div></section>`;
  $('#contenu').querySelectorAll('.admin-menu button').forEach(b=>b.onclick=()=>{S.admin=b.dataset.s;vueAdmin()});
  ({marques:admMarques,marque:admFiche,comptes:admComptes}[S.admin]||admMarques)();
}
function confirmer(el,texte,action){
  const d=document.createElement('div');d.className='confirmation';
  d.innerHTML=`<span>${esc(texte)}</span><button class="btn danger mini" type="button">Confirmer</button><button class="btn sec mini" type="button">Annuler</button>`;
  el.after(d);el.hidden=true;
  const [ok,ann]=d.querySelectorAll('button');ann.onclick=()=>{d.remove();el.hidden=false};ok.onclick=async()=>{ok.disabled=true;await action();};
}
const liste=t=>String(t||'').split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean);
const lignesComptes=t=>String(t||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const [r,...u]=l.split('|');return {reseau:(r||'').trim(),url:u.join('|').trim()}}).filter(o=>o.reseau&&o.url);
const texteComptes=a=>(a||[]).map(o=>o.reseau+' | '+o.url).join('\n');

// ---- Liste des marques suivies ----
async function admMarques(){
  await chargerReferentiel();
  const [{data:quota},{data:us},{data:uc}]=await Promise.all([SB.rpc('quota_marques'),SB.from('utilisateurs').select('email,role,client_id'),SB.from('utilisateur_clients').select('*')]);
  const plein=quota!=null&&S.clients.length>=quota;
  const nbUtil=id=>(us||[]).filter(u=>u.role==='user_client'&&u.client_id===id).length+(uc||[]).filter(x=>x.client_id===id).length;
  const z=$('#admin-corps');
  z.innerHTML=`<div class="bloc"><div class="entete-vue"><h3>Marques suivies</h3>${quota!=null?`<span class="puce num">${S.clients.length} / ${quota}</span>`:''}</div>
    ${S.clients.length?`<div class="defile"><table class="tab"><thead><tr><th>Marque</th><th>Secteur</th><th>Mots-clés</th><th>Utilisateurs dédiés</th><th>État</th><th></th></tr></thead><tbody>${S.clients.map(c=>{const f=S.marques.find(m=>m.client_id===c.id);return `<tr><td><b>${esc(c.nom)}</b></td><td>${esc(c.secteur||'')}</td><td class="num">${(f?.mots_cles||[]).length}</td><td class="num">${nbUtil(c.id)}</td><td>${c.actif?'Suivie':'Suspendue'}</td><td style="text-align:right"><button class="btn mini" data-p="${c.id}">Paramétrer</button></td></tr>`}).join('')}</tbody></table></div>`:'<p class="muted small">Aucune marque suivie. Ajoutez la première ci-dessous, puis paramétrez sa veille.</p>'}</div>
    <form class="bloc" id="f-client"><h3>Ajouter une marque à suivre</h3>
      ${plein?`<p class="muted small">Votre forfait permet de suivre ${quota} marques. Suspendez ou supprimez une marque pour en ajouter une autre.</p>`:''}
      <div class="row"><label>Nom de la marque<input type="text" id="cl-nom" maxlength="80" ${plein?'disabled':''}></label><label>Secteur (facultatif)<input type="text" id="cl-secteur" maxlength="80" ${plein?'disabled':''}></label><button class="btn" type="submit" ${plein?'disabled':''}>Ajouter et paramétrer</button></div></form>`;
  $('#f-client').onsubmit=async e=>{e.preventDefault();const nom=$('#cl-nom').value.trim();if(nom.length<2)return toast('Indiquez le nom de la marque.',true);
    const {data,error}=await SB.from('clients').insert({nom,secteur:$('#cl-secteur').value.trim()||null,cree_par:S.moi.email}).select().single();
    if(error)return toast(error.code==='23505'?'Cette marque est déjà suivie.':error.message,true);
    toast('Marque ajoutée : paramétrez sa veille');await chargerReferentiel();S.admin='marque';S.adminMarque=data.id;vueAdmin()};
  z.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{S.admin='marque';S.adminMarque=Number(b.dataset.p);vueAdmin()});
}

// ---- Fiche de paramétrage d'une marque ----
async function admFiche(){
  await chargerReferentiel();
  const c=S.clients.find(x=>x.id===S.adminMarque);if(!c){S.admin='marques';return vueAdmin()}
  const f=S.marques.find(m=>m.client_id===c.id)||{};
  const [{data:hat},{data:conc},{data:ter},{data:crit},{data:cm},{data:us},{data:uc}]=await Promise.all([
    SB.from('haters').select('*').eq('client_id',c.id).order('nom'),
    SB.from('concurrents').select('*').eq('client_id',c.id).order('nom'),
    SB.from('termes_surveilles').select('*').eq('client_id',c.id).order('terme'),
    SB.from('criteres').select('*').order('ordre'),
    SB.from('criteres_marque').select('*').eq('client_id',c.id),
    SB.from('utilisateurs').select('*').order('email'),
    SB.from('utilisateur_clients').select('*').eq('client_id',c.id)]);
  const voient=(us||[]).filter(u=>(u.role==='user_client'&&u.client_id===c.id)||(uc||[]).some(x=>x.email===u.email));
  const valeur=k=>(cm||[]).find(x=>x.cle===k)?.valeur;
  const groupes=[...new Set((crit||[]).map(x=>x.groupe))];
  const z=$('#admin-corps');
  z.innerHTML=`<div class="bloc"><div class="entete-vue"><h3 style="font-size:1.2rem">${esc(c.nom)}</h3><button class="btn sec mini" id="retour" type="button">Toutes les marques</button></div>
      <form class="row" id="f-ident"><label>Nom de la marque<input type="text" name="nom" value="${esc(c.nom)}" maxlength="80"></label><label>Secteur<input type="text" name="secteur" value="${esc(c.secteur||'')}" maxlength="80"></label><label>Pays surveillé<input type="text" name="pays" value="${esc(f.pays||"Côte d'Ivoire")}"></label><button class="btn sec" type="submit">Enregistrer</button></form></div>

    <form class="bloc" id="f-recherche"><h3>Mots-clés de la veille</h3>
      <label>Mots-clés à rechercher (un par ligne)<textarea name="mots">${esc((f.mots_cles||[]).join('\n'))}</textarea></label>
      <label>Mots à exclure : une publication qui les contient est écartée (un par ligne)<textarea name="excl">${esc((f.exclusions||[]).join('\n'))}</textarea></label>
      <div class="row"><button class="btn" type="submit">Enregistrer les mots-clés</button></div></form>

    <form class="bloc" id="f-officiels"><h3>Comptes officiels de la marque</h3>
      <label>Un compte par ligne : réseau | adresse (par exemple « Facebook | https://facebook.com/marque »)<textarea name="off">${esc(texteComptes(f.comptes_officiels))}</textarea></label>
      <div class="row"><button class="btn" type="submit">Enregistrer les comptes officiels</button></div></form>

    <div class="bloc"><h3>Haters</h3><p class="muted small">Toute publication d'un hater sur la marque devient un point d'attention.</p>
      ${(hat||[]).length?`<table class="tab"><tbody>${hat.map(h=>`<tr><td>${esc(h.nom)}</td><td>${esc(h.reseau)}</td><td class="small">${lienSur(h.url)?`<a href="${esc(lienSur(h.url))}" target="_blank" rel="noopener">Profil</a>`:''}</td><td style="text-align:right"><button class="btn danger mini" data-h="${h.id}">Retirer</button></td></tr>`).join('')}</tbody></table>`:'<p class="muted small">Aucun hater enregistré.</p>'}
      <form class="row" id="f-hater"><label>Réseau<select name="reseau"><option>Facebook</option><option>TikTok</option><option>X</option></select></label><label>Nom du profil<input type="text" name="nom" maxlength="120"></label><label>Adresse du profil<input type="text" name="url"></label><button class="btn sec" type="submit">Ajouter</button></form></div>

    <div class="bloc"><h3>Concurrents</h3><p class="muted small">Leurs publications apparaissent dans l'onglet Concurrents.</p>
      ${(conc||[]).map(k=>`<form class="bloc" style="background:var(--bg)" data-k="${k.id}"><div class="row"><label>Concurrent<input type="text" name="nom" value="${esc(k.nom)}" maxlength="80"></label></div>

    <div class="bloc"><h3>Utilisateurs de la marque</h3>
      ${voient.length?`<table class="tab"><tbody>${voient.map(u=>`<tr><td>${esc(u.nom||'')}<div class="small muted">${esc(u.email)}</div></td><td>${ROLES[u.role]}</td></tr>`).join('')}</tbody></table>`:'<p class="muted small">Aucun utilisateur dédié. Les administrateurs de l’agence voient déjà toutes les marques.</p>'}
      <form class="row" id="f-umarque"><label>Adresse e-mail<input type="email" name="email"></label><label>Nom<input type="text" name="nom" maxlength="80"></label><button class="btn sec" type="submit">Créer un accès marque</button></form>
      <div class="small muted">Un accès marque ne voit que ${esc(c.nom)}. Pour un utilisateur de l'agence qui suit plusieurs marques, passez par Comptes.</div>
      <div id="u-res-marque"></div></div>`;

  $('#retour').onclick=()=>{S.admin='marques';vueAdmin()};
  const ok=(r,m)=>{if(r.error){toast(r.error.code==='23505'?'Ce nom existe déjà.':r.error.message,true);return false}toast(m);return true};
  $('#f-ident').onsubmit=async e=>{e.preventDefault();const t=e.target;
    if(ok(await SB.from('clients').update({nom:t.nom.value.trim(),secteur:t.secteur.value.trim()||null}).eq('id',c.id),'Marque enregistrée')){await SB.from('marques').update({pays:t.pays.value.trim()||"Côte d'Ivoire"}).eq('client_id',c.id);admFiche()}};
  $('#f-recherche').onsubmit=async e=>{e.preventDefault();const t=e.target;ok(await SB.from('marques').update({mots_cles:liste(t.mots.value.replace(/,/g,'\n')),exclusions:liste(t.excl.value.replace(/,/g,'\n'))}).eq('client_id',c.id),'Mots-clés enregistrés')};
  $('#f-officiels').onsubmit=async e=>{e.preventDefault();ok(await SB.from('marques').update({comptes_officiels:lignesComptes(e.target.off.value)}).eq('client_id',c.id),'Comptes officiels enregistrés')};
  $('#f-hater').onsubmit=async e=>{e.preventDefault();const t=e.target;if(!t.nom.value.trim())return toast('Indiquez le nom du profil.',true);
    if(ok(await SB.from('haters').insert({client_id:c.id,reseau:t.reseau.value,nom:t.nom.value.trim(),url:t.url.value.trim()||null,ajoute_par:S.moi.email}),'Hater ajouté'))admFiche()};
  z.querySelectorAll('[data-h]').forEach(b=>b.onclick=async()=>{if(ok(await SB.from('haters').delete().eq('id',b.dataset.h),'Hater retiré'))admFiche()});
  $('#f-conc').onsubmit=async e=>{e.preventDefault();const n=e.target.nom.value.trim();if(!n)return toast('Indiquez le nom du concurrent.',true);
    if(ok(await SB.from('concurrents').insert({client_id:c.id,nom:n}),'Concurrent ajouté : indiquez ses mots-clés et ses comptes'))admFiche()};
  z.querySelectorAll('form[data-k]').forEach(fk=>fk.onsubmit=async e=>{e.preventDefault();
    ok(await SB.from('concurrents').update({nom:fk.nom.value.trim(),mots_cles:liste(fk.mots.value.replace(/,/g,'\n')),comptes:lignesComptes(fk.off.value)}).eq('id',fk.dataset.k),'Concurrent enregistré')});
  z.querySelectorAll('[data-ks]').forEach(b=>b.onclick=()=>confirmer(b,'Retirer ce concurrent de la veille ?',async()=>{if(ok(await SB.from('concurrents').delete().eq('id',b.dataset.ks),'Concurrent retiré'))admFiche()}));
  $('#f-terme').onsubmit=async e=>{e.preventDefault();const t=e.target.terme.value.trim();if(t.length<2)return toast('Le terme doit faire au moins 2 caractères.',true);
    if(ok(await SB.from('termes_surveilles').insert({marque_id:f.id,client_id:c.id,terme:t}),'Terme ajouté'))admFiche()};
  z.querySelectorAll('[data-t]').forEach(b=>b.onclick=async()=>{if(ok(await SB.from('termes_surveilles').delete().eq('id',b.dataset.t),'Terme retiré'))admFiche()});
  z.querySelectorAll('form[data-c]').forEach(fc=>fc.onsubmit=async e=>{e.preventDefault();const r=await SB.rpc('modifier_critere',{p_cle:fc.dataset.c,p_valeur:Number(fc.v.value),p_client:c.id});ok(r,'Critère enregistré')});
  $('#f-umarque').onsubmit=async e=>{e.preventDefault();const t=e.target,email=t.email.value.trim().toLowerCase();
    const j=await fonctionComptes({action:'creer',email,nom:t.nom.value.trim(),role:'user_client',client_id:c.id});
    if(!j.ok)return toast('Création impossible : '+j.erreur,true);toast('Accès marque créé');await admFiche();montrerMdp($('#u-res-marque'),email,j.mot_de_passe)};
}

async function fonctionComptes(corps){
  const {data:{session}}=await SB.auth.getSession();
  const r=await fetch(SB_URL+'/functions/v1/gerer-utilisateur',{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_CLE,Authorization:'Bearer '+session.access_token},body:JSON.stringify(corps)});
  let j={};try{j=await r.json()}catch{j={ok:false,erreur:'réponse illisible'}}
  return j;
}
function montrerMdp(el,email,mdp){
  el.innerHTML=`<div class="bloc" style="background:var(--bg)"><div class="small">Mot de passe provisoire de <b>${esc(email)}</b>, affiché une seule fois :</div><div class="row"><div class="mdp">${esc(mdp)}</div><button class="btn sec" type="button">Copier</button></div><div class="small muted">Adresse de la plateforme : <span style="user-select:all">${esc(location.href.split('#')[0])}</span></div></div>`;
  el.querySelector('button').onclick=async()=>{try{await navigator.clipboard.writeText(mdp);toast('Copié')}catch{toast('Sélectionnez le mot de passe pour le copier.')}};
}

// ---- Comptes ----
async function admComptes(){
  await chargerReferentiel();
  const z=$('#admin-corps');
  const [{data:us},{data:uc}]=await Promise.all([SB.from('utilisateurs').select('*').order('role').order('email'),SB.from('utilisateur_clients').select('*')]);
  const roles=GERE[S.moi.role]||[];
  const voit=u=>u.role==='user_client'?nomClient(u.client_id):u.role==='user_agence'?(uc||[]).filter(x=>x.email===u.email).map(x=>nomClient(x.client_id)).join(', '):'Toutes les marques';
  z.innerHTML=`<form class="bloc" id="f-compte"><h3>Créer un compte</h3>
    <div class="row"><label>Adresse e-mail<input type="email" id="u-email"></label><label>Nom<input type="text" id="u-nom" maxlength="80"></label>
    <label>Rôle<select id="u-role">${roles.map(r=>`<option value="${r}">${ROLES[r]}</option>`).join('')}</select></label></div>
    <div id="u-un-client" hidden><label>Marque<select id="u-client">${S.clients.map(c=>`<option value="${c.id}">${esc(c.nom)}</option>`).join('')}</select></label></div>
    <div id="u-plusieurs" hidden><div class="small muted">Marques visibles</div><div class="clients-coches">${S.clients.map(c=>`<label><input type="checkbox" value="${c.id}">${esc(c.nom)}</label>`).join('')||'<span class="muted small">Ajoutez d’abord une marque suivie.</span>'}</div></div>
    <p class="muted small" id="u-aide"></p>
    <div class="row"><button class="btn" type="submit" id="u-btn">Créer le compte</button></div><div id="u-resultat"></div></form>
    <div class="bloc"><h3>Comptes</h3><div class="defile"><table class="tab"><thead><tr><th>Personne</th><th>Rôle</th><th>Marques visibles</th><th>État</th><th></th></tr></thead><tbody>
    ${(us||[]).map(u=>{const gere=roles.includes(u.role)&&u.email!==S.moi.email;return `<tr><td>${esc(u.nom||'')}<div class="small muted">${esc(u.email)}</div></td><td>${ROLES[u.role]}</td><td class="small">${esc(voit(u))}</td><td>${u.actif?'Actif':'Désactivé'}</td>
    <td style="text-align:right;white-space:nowrap">${gere?`<button class="btn sec mini" data-r="${esc(u.email)}">Nouveau mot de passe</button> <button class="btn sec mini" data-d="${esc(u.email)}">${u.actif?'Désactiver':'Réactiver'}</button> <button class="btn danger mini" data-x="${esc(u.email)}">Supprimer</button>`:''}</td></tr>`}).join('')}
    </tbody></table></div><div id="u-res2"></div></div>`;
  const AIDE={admin_agence:'Voit et paramètre toutes les marques de l’agence, et gère les comptes.',user_agence:'Membre de l’agence : voit les marques cochées, peut suivre, épingler et signaler des points d’attention.',user_client:'Accès réservé à une marque : consultation de sa seule veille.',admin_plateforme:'Administration de la plateforme.',super_admin:'Accès complet, journal compris.'};
  const maj=()=>{const r=$('#u-role').value;$('#u-un-client').hidden=r!=='user_client';$('#u-plusieurs').hidden=r!=='user_agence';$('#u-aide').textContent=AIDE[r]||''};$('#u-role').onchange=maj;maj();
  $('#f-compte').onsubmit=async e=>{e.preventDefault();$('#u-btn').disabled=true;
    const role=$('#u-role').value,email=$('#u-email').value.trim().toLowerCase();
    const j=await fonctionComptes({action:'creer',email,nom:$('#u-nom').value.trim(),role,client_id:Number($('#u-client').value)||null,clients:[...z.querySelectorAll('#u-plusieurs input:checked')].map(i=>Number(i.value))});
    $('#u-btn').disabled=false;
    if(!j.ok)return toast('Création impossible : '+j.erreur,true);
    toast('Compte créé');await admComptes();montrerMdp($('#u-resultat'),email,j.mot_de_passe)};
  z.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{const j=await fonctionComptes({action:'reinitialiser',email:b.dataset.r});if(!j.ok)return toast(j.erreur,true);montrerMdp($('#u-res2'),b.dataset.r,j.mot_de_passe)});
  z.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{const u=us.find(x=>x.email===b.dataset.d);
    const j=await fonctionComptes({action:'modifier',email:u.email,nom:u.nom,role:u.role,client_id:u.client_id,clients:(uc||[]).filter(x=>x.email===u.email).map(x=>x.client_id),actif:!u.actif});
    if(!j.ok)return toast(j.erreur,true);toast(u.actif?'Compte désactivé':'Compte réactivé');admComptes()});
  z.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>confirmer(b,'Supprimer ce compte ?',async()=>{const j=await fonctionComptes({action:'supprimer',email:b.dataset.x});if(!j.ok)return toast(j.erreur,true);toast('Compte supprimé');admComptes()}));
}

// ===== Journal (super administrateur) =====
async function vueJournal(){
  const {data}=await SB.from('journal').select('*').order('le',{ascending:false}).limit(300);
  $('#contenu').innerHTML=`<section class="vue"><div class="entete-vue"><h2>Journal d'activité</h2><span class="muted small">300 derniers événements</span></div>
    <div class="bloc"><div class="defile"><table class="tab"><thead><tr><th>Date</th><th>Type</th><th>Par</th><th>Détail</th></tr></thead><tbody>${(data||[]).map(j=>`<tr><td class="num small" style="white-space:nowrap">${date(j.le)}</td><td>${esc(j.type)}</td><td class="small">${esc(j.par||'')}</td><td class="small">${esc(j.detail||'')}</td></tr>`).join('')}</tbody></table></div></div></section>`;
}

SB.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'){S.moi=null;afficher('connexion')}});
demarrer();
</script>
